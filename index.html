<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="MrMidnight">
  <title>Platformer · MrMidnight</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.55rem;
      background: #0d0f14; color: #e8eaed;
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 1rem; user-select: none;
    }
    h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: 0.04em; }
    .hud {
      display: flex; gap: 1.2rem; font-size: 0.95rem;
      font-variant-numeric: tabular-nums; color: #9aa0a6; align-items: center;
    }
    .hud strong { color: #e8eaed; margin-left: 0.3rem; }
    #biomeLabel { font-size: 0.8rem; color: #6b7280; font-style: italic; }
    .lives { display: flex; gap: 4px; align-items: center; }
    .heart { font-size: 1rem; } .heart.lost { opacity: 0.22; }
    #game {
      display: block; border: 2px solid #2a3140; border-radius: 4px;
      background: #12151c; box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      image-rendering: pixelated; touch-action: none;
    }
    .vol-row { display: flex; gap: 1.2rem; align-items: center; font-size: 0.8rem; color: #6b7280; }
    .vol-row label { display: flex; align-items: center; gap: 0.45rem; white-space: nowrap; }
    .vol-row input[type=range] { width: 90px; height: 4px; accent-color: #38bdf8; cursor: pointer; }
    .vol-val { font-variant-numeric: tabular-nums; min-width: 28px; color: #9aa0a6; }
    .hint { font-size: 0.8rem; color: #6b7280; text-align: center; max-width: 640px; line-height: 1.45; }
    .credit { font-size: 0.8rem; color: #6b7280; }
    .credit a { color: #9aa0a6; text-decoration: none; }
    .credit a:hover { color: #e8eaed; text-decoration: underline; }
    #mobile-controls { display: none; gap: 8px; margin-top: 2px; }
    .mob-btn {
      width: 58px; height: 52px; background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.13); border-radius: 8px;
      color: #cdd5e0; font-size: 1.35rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s; -webkit-tap-highlight-color: transparent;
    }
    .mob-btn:active, .mob-btn.pressed { background: rgba(255,255,255,0.15); }
    #mob-jump { width: 72px; font-size: 1.5rem; }
    @media (pointer: coarse) { #mobile-controls { display: flex; } .hint span.kb-hint { display: none; } }
    #canvas-wrap { position: relative; display: inline-block; line-height: 0; }
    #overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(13,15,20,0.9); border-radius: 4px;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 0.85rem; z-index: 10;
    }
    #overlay.active { display: flex; }
    #overlay h2 { font-size: 2rem; font-weight: 700; letter-spacing: 0.05em; }
    #overlay .ov-sub   { font-size: 1rem;    color: #9aa0a6; }
    #overlay .ov-score { font-size: 1.15rem; color: #e8eaed; }
    #overlay .ov-record{ font-size: 0.9rem;  color: #fbbf24; }
    #restart-btn {
      margin-top: 0.4rem; padding: 0.6rem 2.2rem; background: #38bdf8;
      color: #0d0f14; border: none; border-radius: 6px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      letter-spacing: 0.03em; transition: background 0.15s, transform 0.1s;
    }
    #restart-btn:hover  { background: #7dd3fc; }
    #restart-btn:active { transform: scale(0.96); }

    /* ── Shop overlay ── */
    #shop-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(10,12,18,0.96); border-radius: 4px;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 1.1rem; z-index: 20;
    }
    #shop-overlay.active { display: flex; }
    #shop-overlay h2 { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.05em; color: #fbbf24; }
    #shop-overlay .shop-sub { font-size: 0.9rem; color: #6b7280; }
    .shop-items { display: flex; gap: 1rem; }
    .shop-item {
      background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 1.1rem 1.4rem;
      display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
      cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s;
      min-width: 130px;
    }
    .shop-item:hover  { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.25); }
    .shop-item:active { transform: scale(0.96); }
    .shop-item.disabled { opacity: 0.38; cursor: not-allowed; pointer-events: none; }
    .shop-item .si-icon  { font-size: 2rem; }
    .shop-item .si-name  { font-size: 0.9rem; color: #e8eaed; font-weight: 600; }
    .shop-item .si-cost  { font-size: 0.82rem; color: #fbbf24; }
    .shop-item .si-desc  { font-size: 0.75rem; color: #6b7280; text-align: center; }
    #shop-skip { margin-top: 0.2rem; background: transparent; border: 1.5px solid #374151;
      color: #6b7280; border-radius: 6px; padding: 0.45rem 1.6rem;
      font-size: 0.88rem; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
    #shop-skip:hover { border-color: #9aa0a6; color: #e8eaed; }

    /* ── Timer bar ── */
    #timer-wrap {
      display: none; position: absolute; left: 0; right: 0; top: 0; height: 5px; z-index: 5;
    }
    #timer-wrap.active { display: block; }
    #timer-bar { height: 100%; width: 100%; background: #38bdf8; transition: background 0.3s; border-radius: 0 0 2px 2px; }

    /* ── Special level banner ── */
    #level-banner {
      display: none; position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      background: rgba(10,12,18,0.88); border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 8px; padding: 0.4rem 1.1rem; font-size: 0.88rem;
      color: #e8eaed; letter-spacing: 0.03em; z-index: 6; white-space: nowrap;
      pointer-events: none;
    }
    #level-banner.active { display: block; }

    /* ── Shield pip in HUD ── */
    #shield-pip { display: none; font-size: 1rem; }
    #shield-pip.active { display: inline; }
  </style>
</head>
<body>
  <h1>Platformer</h1>
  <div class="hud">
    <span>Level<strong id="levelDisplay">1</strong></span>
    <span>Score<strong id="scoreDisplay">0</strong></span>
    <span>🪙<strong id="coinsDisplay">0</strong></span>
    <span id="biomeLabel">Space</span>
    <span id="shield-pip">🛡</span>
    <button id="skip-btn" title="Use skip token" style="display:none;background:rgba(251,191,36,0.15);border:1.5px solid #fbbf24;color:#fbbf24;border-radius:6px;padding:0.18rem 0.55rem;font-size:0.8rem;cursor:pointer;line-height:1.3;">⏭ Skip (<span id="skipCount">0</span>)</button>
    <span class="lives">
      <span class="heart" id="h1">❤️</span>
      <span class="heart" id="h2">❤️</span>
      <span class="heart" id="h3">❤️</span>
    </span>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="1100" height="540" aria-label="Platformer game"></canvas>
    <div id="timer-wrap"><div id="timer-bar"></div></div>
    <div id="level-banner"></div>
    <div id="shop-overlay">
      <h2>🏪 Shop</h2>
      <p class="shop-sub" id="shop-coins-label">You have 0 coins</p>
      <div class="shop-items">
        <div class="shop-item" id="shop-life">
          <span class="si-icon">❤️</span>
          <span class="si-name">Extra Life</span>
          <span class="si-cost">5 coins</span>
          <span class="si-desc">+1 life (max 3)</span>
        </div>
        <div class="shop-item" id="shop-skip">
          <span class="si-icon">⏭</span>
          <span class="si-name">Skip Level</span>
          <span class="si-cost">15 coins</span>
          <span class="si-desc">Saves a skip token</span>
        </div>
      </div>
      <button id="shop-close">Continue →</button>
    </div>
    <div id="overlay">
      <h2 id="ov-title">GAME OVER</h2>
      <p class="ov-sub"   id="ov-sub"></p>
      <p class="ov-score" id="ov-score"></p>
      <p class="ov-record" id="ov-record"></p>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <div id="mobile-controls">
    <button class="mob-btn" id="mob-left">◀</button>
    <button class="mob-btn" id="mob-jump">▲</button>
    <button class="mob-btn" id="mob-right">▶</button>
  </div>

  <div class="vol-row">
    <label>🔊 SFX  <input type="range" id="volSfx"   min="0" max="100" value="40"> <span class="vol-val" id="volSfxVal">40%</span></label>
    <label>🎵 Music <input type="range" id="volMusic" min="0" max="100" value="25"> <span class="vol-val" id="volMusicVal">25%</span></label>
  </div>

  <p class="hint"><span class="kb-hint">← → / WASD · ↑ / Space jump · </span>collect coins · reach the door · watch for moving platforms!</p>
  <p class="credit">by <a href="https://github.com/MrMidnight-dev" target="_blank" rel="noopener noreferrer">MrMidnight</a></p>

<script>
// =========================================================================
// VOLUME
// =========================================================================
let sfxVol = 0.40, musicVol = 0.25;
const volSfxEl = document.getElementById("volSfx");
const volMusicEl = document.getElementById("volMusic");
const volSfxVal = document.getElementById("volSfxVal");
const volMusicVal = document.getElementById("volMusicVal");
volSfxEl.addEventListener("input", () => { sfxVol = volSfxEl.value/100; volSfxVal.textContent = volSfxEl.value+"%"; });
volMusicEl.addEventListener("input", () => {
  musicVol = volMusicEl.value/100; volMusicVal.textContent = volMusicEl.value+"%";
  if (musicGain) musicGain.gain.setTargetAtTime(musicVol*0.18, getAC().currentTime, 0.05);
});

// =========================================================================
// AUDIO
// =========================================================================
let ac = null, musicGain = null, musicNodes = [];
function getAC() {
  if (!ac) try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  return ac;
}
function playTone(freq, type, dur, vol) {
  const a = getAC(); if (!a || sfxVol===0) return;
  const g = a.createGain(), o = a.createOscillator();
  o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
  g.gain.setValueAtTime(0, a.currentTime);
  g.gain.linearRampToValueAtTime(vol*sfxVol, a.currentTime+0.008);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+dur+0.01);
}
function sfxJump()    { playTone(300,'sine',0.10,0.28); playTone(460,'sine',0.07,0.18); }
function sfxDeath()   { playTone(200,'sine',0.22,0.30); playTone(130,'sine',0.30,0.22); }
function sfxCoin()    { const a=getAC(); if(!a||sfxVol===0) return; [600,800,1000].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.10,0.18),i*50)); }
function sfxWin()     { const a=getAC(); if(!a||sfxVol===0) return; [440,554,659,880].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.18,0.22),i*100)); }
function sfxGameOver(){ const a=getAC(); if(!a||sfxVol===0) return; [330,247,196,147].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.28,0.22),i*160)); }

// ── Per-biome music tracks ────────────────────────────────────────────────
// Each track is defined as { notes[], step, type, amp }
// notes = Hz values, step = seconds per note, type = oscillator type
const BIOME_TRACKS = {
  space: {
    // Floating arpeggios — sparse, ethereal
    notes: [130.8, 164.8, 196.0, 246.9, 261.6, 196.0, 164.8, 130.8],
    step: 0.38, type: "sine", amp: 0.18,
  },
  forest: {
    // Bouncy major pentatonic — bright, nature-like
    notes: [261.6, 329.6, 392.0, 523.2, 392.0, 329.6, 261.6, 220.0,
            261.6, 392.0, 523.2, 659.2, 523.2, 392.0, 329.6, 261.6],
    step: 0.28, type: "sine", amp: 0.16,
  },
  dungeon: {
    // Ominous low pulse — minor, tense
    notes: [98.0, 110.0, 123.5, 110.0, 98.0, 92.5, 98.0, 110.0,
            123.5, 130.8, 123.5, 110.0, 98.0, 87.3, 92.5, 98.0],
    step: 0.45, type: "triangle", amp: 0.22,
  },
  volcano: {
    // Driving rhythmic pattern — intense, percussive feel
    notes: [146.8, 164.8, 146.8, 110.0, 130.8, 146.8, 164.8, 196.0,
            146.8, 130.8, 110.0, 123.5, 146.8, 164.8, 130.8, 110.0],
    step: 0.22, type: "sawtooth", amp: 0.10,
  },
};

let currentTrackName = "";

function startMusic(biomeName) {
  const a = getAC(); if (!a) return;
  const trackName = biomeName || "space";
  if (trackName === currentTrackName && musicGain) return; // already playing
  stopMusic();
  currentTrackName = trackName;
  musicGain = a.createGain();
  musicGain.gain.setValueAtTime(musicVol * 0.18, a.currentTime);
  musicGain.connect(a.destination);

  const track = BIOME_TRACKS[trackName] || BIOME_TRACKS.space;
  const { notes, step, type, amp } = track;
  let t = a.currentTime + 0.1;

  function scheduleLoop() {
    notes.forEach((freq, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t + i*step);
      g.gain.linearRampToValueAtTime(amp, t + i*step + 0.012);
      g.gain.exponentialRampToValueAtTime(0.001, t + i*step + step*0.85);
      o.connect(g); g.connect(musicGain);
      o.start(t + i*step); o.stop(t + i*step + step);
      musicNodes.push(o);
    });
    t += notes.length * step;
  }

  for (let b = 0; b < 3; b++) scheduleLoop();
  const loopMs = notes.length * step * 1000 * 0.85;
  const id = setInterval(() => {
    if (!ac || ac.state === "closed") { clearInterval(id); return; }
    scheduleLoop();
  }, loopMs);
  musicNodes.push({ stop: () => clearInterval(id) });
}
function stopMusic() {
  musicNodes.forEach(n => { try { n.stop && n.stop(); } catch(e){} });
  musicNodes = []; currentTrackName = "";
}

// =========================================================================
// BIOMES  — each defines colours, bg style, platform tints, spike shape
// =========================================================================
const BIOMES = {
  space: {
    name: "Space",
    bg: "#0a0c12", bgStars: true, bgGrid: true,
    pitColor: "rgba(0,0,0,0.6)",
    platform: ["#3b82f6","#6366f1","#8b5cf6","#06b6d4","#0ea5e9"],
    spike: "#818cf8", spikeGlow: "rgba(129,140,248,0.6)",
    accent: "#38bdf8",
  },
  forest: {
    name: "Forest",
    bg: "#0b1a0d", bgStars: false, bgGrid: false,
    pitColor: "rgba(5,15,5,0.7)",
    platform: ["#16a34a","#15803d","#166534","#4ade80","#22c55e"],
    spike: "#ef4444", spikeGlow: "rgba(239,68,68,0.5)",
    accent: "#86efac",
  },
  dungeon: {
    name: "Dungeon",
    bg: "#100a0a", bgStars: false, bgGrid: true,
    pitColor: "rgba(0,0,0,0.8)",
    platform: ["#78716c","#57534e","#a8a29e","#44403c","#292524"],
    spike: "#dc2626", spikeGlow: "rgba(220,38,38,0.6)",
    accent: "#f97316",
  },
  volcano: {
    name: "Volcano",
    bg: "#150800", bgStars: false, bgGrid: false,
    pitColor: "rgba(180,30,0,0.45)",
    platform: ["#b45309","#92400e","#c2410c","#7c2d12","#f97316"],
    spike: "#fbbf24", spikeGlow: "rgba(251,191,36,0.7)",
    accent: "#fb923c",
  },
};
const BIOME_ORDER = ["space","forest","dungeon","volcano"];

// =========================================================================
// CONFIG
// =========================================================================
const CFG = {
  W:1100, H:540,
  gravUp:0.2, gravFall:0.26,
  moveSpeed:2.4, moveAccel:0.14,
  groundFric:0.86, airFric:0.97,
  jumpForce:-8.6, jumpCutVy:-3.8, maxFall:4.5,
  pSize:28, pitY:528,
  platMinW:75, platMaxW:140, platH:16,
  maxJumpX:98, maxJumpUp:80, maxDrop:92,
  minPlats:5, maxPlats:8,
  groundY:470,
  maxLives:3, coinValue:10,
};

// =========================================================================
// DIFFICULTY SCALING  — smoothly ramps from level 1 onward
// =========================================================================
function difficulty(lvl) {
  const t = Math.min((lvl-1)/14, 1); // 0..1 over 15 levels
  return {
    spikeChance:   0.20 + t*0.45,          // 0.20 → 0.65
    extraSpikes:   Math.floor(t*2),         // 0 → 2 extra spikes per platform
    gapBonus:      Math.floor(t*18),        // adds to maxJumpX gap
    movingChance:  t > 0.15 ? 0.18+t*0.3 : 0, // no movers until lvl 3
    movingSpeed:   0.9 + t*2.2,            // px/frame
    coinChance:    0.40 - t*0.12,           // slightly fewer coins at high lvl
    extraPlats:    Math.min(Math.floor(t*3), 3), // up to 3 extra platforms
  };
}

// =========================================================================
// STATE
// =========================================================================
const canvas      = document.getElementById("game");
const ctx         = canvas.getContext("2d");
const levelDisplay = document.getElementById("levelDisplay");
const scoreDisplay = document.getElementById("scoreDisplay");
const coinsDisplay = document.getElementById("coinsDisplay");
const biomeLabel   = document.getElementById("biomeLabel");
const overlay      = document.getElementById("overlay");
const ovTitle      = document.getElementById("ov-title");
const ovSub        = document.getElementById("ov-sub");
const ovScore      = document.getElementById("ov-score");
const ovRecord     = document.getElementById("ov-record");
const restartBtn   = document.getElementById("restart-btn");

const keys = { left:false, right:false, up:false };

let levelNumber     = 1;
let score           = 0;
let totalCoins      = 0;
let lives           = CFG.maxLives;
let record          = parseInt(localStorage.getItem("pfRecord")||"0");
let level           = null;
let player          = null;
let deathFlash      = 0;
let isDead          = false;
let gameOver        = false;
let levelTransition = false;
let particles       = [];
let stars           = [];
let currentBiome    = BIOMES.space;

// ── Shop ──────────────────────────────────────────────────────────────────
let shopOpen        = false;
let pendingShop     = false;
let skipTokens      = 0;  // owned skip-level tokens

// ── Special level types ───────────────────────────────────────────────────
// "normal" | "timer" | "treasure"
let specialType     = "normal";
let timerSeconds    = 0;    // countdown in seconds
let timerMs         = 0;    // accumulated ms
let timerActive     = false;

// ── Active buffs ──────────────────────────────────────────────────────────
let hasShield       = false;  // absorb one hit

// =========================================================================
// STARS  (only for biomes with bgStars)
// =========================================================================
function initStars() {
  stars = [];
  for (let i=0;i<65;i++) stars.push({
    x:Math.random()*CFG.W, y:Math.random()*CFG.H*0.78,
    r:Math.random()*1.4+0.4, alpha:Math.random()*0.45+0.12,
    twinkle:Math.random()*Math.PI*2,
  });
}
initStars();

// =========================================================================
// PARTICLES
// =========================================================================
function spawnParticles(x, y, color, count, speed) {
  for (let i=0;i<count;i++) {
    const angle=(Math.PI*2*i/count)+Math.random()*0.5;
    const s=speed*(0.6+Math.random()*0.8);
    particles.push({x,y,vx:Math.cos(angle)*s,vy:Math.sin(angle)*s-1.5,
      life:1,decay:0.045+Math.random()*0.03,r:3+Math.random()*3,color});
  }
}
function updateParticles() {
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=p.decay;return p.life>0;});
}
function drawParticles() {
  for (const p of particles){ctx.globalAlpha=p.life*0.9;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
}

// =========================================================================
// HUD
// =========================================================================
function updateLivesHud() {
  for (let i=1;i<=CFG.maxLives;i++){const el=document.getElementById(`h${i}`);if(el)el.classList.toggle("lost",i>lives);}
}
function updateHud() {
  levelDisplay.textContent=levelNumber;
  scoreDisplay.textContent=score;
  coinsDisplay.textContent=totalCoins;
  biomeLabel.textContent=currentBiome.name;
  updateLivesHud();
}

// =========================================================================
// LEVEL GENERATION — biomes + difficulty + new structures
// =========================================================================
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function randFloat(min,max){return min+Math.random()*(max-min);}

function getBiome(lvl) {
  const idx = Math.floor((lvl-1)/10) % BIOME_ORDER.length;
  return BIOMES[BIOME_ORDER[idx]];
}

// ── Physics-based jump reach calculator ──────────────────────────────────
// Given a starting platform, returns the box of reachable positions for
// the next platform's top-left corner. Keeps generation honest.
function jumpReach(diff) {
  // Horizontal: player can travel ~maxJumpX + difficulty bonus px during a jump
  const maxH = CFG.maxJumpX + diff.gapBonus;
  // Vertical up: max height gain during jump
  const maxU = CFG.maxJumpUp;
  // Vertical down: max drop (player survives landing)
  const maxD = CFG.maxDrop;
  return { maxH, maxU, maxD };
}

// ── Overlap check (with breathing room) ──────────────────────────────────
function platsOverlap(a, b) {
  const mx = 6;   // horizontal margin
  const my = 40;  // vertical clear zone — no platform within 40px above/below
  return a.x < b.x+b.w+mx && a.x+a.w+mx > b.x &&
         a.y < b.y+b.h+my && a.y+a.h+my > b.y;
}

// ── Spike helpers ─────────────────────────────────────────────────────────
function maxSpikesForWidth(w) { return Math.max(0, Math.floor((w-32)/22)); }

// ── Door clearance check ──────────────────────────────────────────────────
// Returns true if rect r is too close to the door zone
function nearDoor(r, door) {
  const pad = 20;
  return r.x < door.x+door.w+pad && r.x+r.w > door.x-pad &&
         r.y < door.y+door.h+pad && r.y+r.h > door.y-pad;
}

// ── Layout directions ─────────────────────────────────────────────────────
// "lr"  = left→right (classic)
// "rl"  = right→left
// "bu"  = bottom→up (start bottom-right, climb to top-left)
// "mix" = left→right but with aggressive vertical variation
const LAYOUTS = ["lr","rl","lr","mix","lr","rl"]; // "bu" removed — caused unreachable layouts

function pickLayout(lvl) {
  // First 2 levels always left-right so player learns the game
  if (lvl <= 3) return "lr"; // first 3 levels always left-right
  return LAYOUTS[randInt(0, LAYOUTS.length-1)];
}

// ── Main generation ───────────────────────────────────────────────────────
function tryGenerateLevel(lvl) {
  const diff  = difficulty(lvl);
  const biome = getBiome(lvl);
  const reach = jumpReach(diff);
  const layout = pickLayout(lvl);
  const platforms=[], spikes=[], coins=[], fallers=[];

  const count = randInt(CFG.minPlats, CFG.maxPlats + diff.extraPlats);

  // ── Determine start position by layout ──────────────────────────────
  let curX, curY, dirX, dirY;
  const margin = 50;

  if (layout === "lr") {
    curX = margin; curY = CFG.groundY - randInt(60,110);
    dirX =  1; dirY = 0;
  } else if (layout === "rl") {
    curX = CFG.W - margin - randInt(90,130); curY = CFG.groundY - randInt(60,110);
    dirX = -1; dirY = 0;
  } else if (layout === "bu") {
    // Start bottom-right, door will be top-left area
    curX = CFG.W - margin - randInt(90,130);
    curY = CFG.groundY - randInt(40,70);   // near bottom
    dirX = -1; dirY = -1;  // move left and generally up
  } else { // mix
    curX = margin; curY = CFG.groundY - randInt(60,110);
    dirX = 1; dirY = 0;
  }

  const startW = randInt(95,140);
  platforms.push({x:curX, y:curY, w:startW, h:CFG.platH, color:0, biome});

  for (let i=1; i<count; i++) {
    const prev   = platforms[platforms.length-1];
    const isLast = i === count-1;
    let newX, newY, newW;
    let placed = false;

    for (let attempt=0; attempt<14; attempt++) {
      newW = randInt(CFG.platMinW, CFG.platMaxW);

      let gapX, dy;

      // Hard limits derived from player physics:
      // Horizontal: player can jump at most ~reach.maxH px during a full jump arc
      // Vertical up: max height gain is reach.maxU px
      // Vertical down: max safe drop is reach.maxD px
      const safeGapMax = reach.maxH - 10;   // leave 10px safety margin
      const safeUp     = reach.maxU - 8;
      const safeDown   = reach.maxD - 8;

      if (layout === "bu") {
        gapX = randInt(30, Math.min(safeGapMax, 85));
        dy   = isLast ? randInt(-safeUp, -30) : randInt(-safeUp, -18);
        const side = (i%2===0 ? 1 : -1) * (dirX < 0 ? -1 : 1);
        newX = prev.x + side * (prev.w + Math.abs(gapX));
      } else if (layout === "mix") {
        gapX = randInt(35, Math.min(safeGapMax, 90));
        dy   = isLast ? randInt(-safeUp, -28)
             : randInt(-safeUp, safeDown);
        newX = prev.x + dirX * (prev.w + gapX);
      } else {
        gapX = isLast ? randInt(50, Math.min(safeGapMax, 88))
                      : randInt(32, Math.min(safeGapMax, 88));
        dy   = isLast ? randInt(-safeUp, -22)
                      : randInt(-safeUp, safeDown);
        newX = prev.x + dirX * (prev.w + gapX);
      }

      newY = Math.max(78, Math.min(CFG.groundY - 68, prev.y + dy));
      newX = Math.max(12, Math.min(CFG.W - newW - 12, newX));

      const candidate = {x:newX, y:newY, w:newW, h:CFG.platH};

      // Reachability check: the actual gap after clamping must be jumpable.
      // dx = horizontal distance between platform edges (can be 0 if overlapping in X)
      // dy = vertical difference (positive = next is lower)
      const dx = Math.max(0, newX > prev.x ? newX - (prev.x+prev.w) : prev.x - (newX+newW));
      const actualDy = newY - prev.y; // positive = lower, negative = higher

      const reachable = dx <= reach.maxH && actualDy <= reach.maxD && actualDy >= -reach.maxU;
      if (!reachable) continue;

      // No overlap with existing platforms
      if (!platforms.every(p => !platsOverlap(candidate, p))) continue;

      placed = true; break;
    }

    if (!placed) continue;

    const platObj = {x:newX, y:newY, w:newW, h:CFG.platH, color:i%biome.platform.length, biome};

    // Moving platforms: only mid-level, only if enough horizontal gap from neighbours
    if (!isLast && i>1 && Math.random() < diff.movingChance) {
      const axis = Math.random() < 0.6 ? "h" : "v";
      // Safe range: never more than 40% of the gap to the previous platform
      const gap = Math.abs(newX - (prev.x+prev.w));
      const maxRange = axis==="h" ? Math.min(gap*0.38, 50) : 34;
      if (maxRange >= 14) {
        platObj.moving = {
          axis, range: randInt(14, Math.floor(maxRange)),
          speed: diff.movingSpeed * (0.55+Math.random()*0.7),
          origin: axis==="h" ? newX : newY,
          t: Math.random()*Math.PI*2,
        };
      }
    }

    platforms.push(platObj);

    // Spikes: not on moving platforms, not on last platform
    // Placement styles: left-edge, right-edge, both-edges, center, spread
    if (!isLast && i>1 && !platObj.moving && newW >= 100 && Math.random() < diff.spikeChance) {
      const maxFit = maxSpikesForWidth(newW);
      if (maxFit >= 1) {
        // Styles: 0=left cluster  1=right cluster  2=both edges  3=spread
        const style = randInt(0, 3);
        const edgeOff = 6; // px from platform edge
        const sc = randInt(1, Math.min(1+diff.extraSpikes, maxFit));
        if (style === 0) {
          // Left side cluster
          for (let s=0; s<sc; s++) spikes.push({x:newX+edgeOff+s*20, y:newY-14, w:14, h:14});
        } else if (style === 1) {
          // Right side cluster
          for (let s=0; s<sc; s++) spikes.push({x:newX+newW-edgeOff-14-s*20, y:newY-14, w:14, h:14});
        } else if (style === 2) {
          // Both edges — 1 spike each side, middle stays clear
          spikes.push({x:newX+edgeOff,         y:newY-14, w:14, h:14});
          spikes.push({x:newX+newW-edgeOff-14, y:newY-14, w:14, h:14});
        } else {
          // Spread: random positions with min spacing, never dead-center
          const placed2 = [];
          const mid = newX + newW/2;
          for (let s=0; s<sc*4 && placed2.length<sc; s++) {
            const sx = newX + edgeOff + randInt(0, newW - 14 - edgeOff*2);
            const notCenter = Math.abs(sx + 7 - mid) > 18;
            if (notCenter && placed2.every(px => Math.abs(px-sx) > 18)) placed2.push(sx);
          }
          for (const sx of placed2) spikes.push({x:sx, y:newY-14, w:14, h:14});
        }
      }
    }

    // Coins: never where spikes are, never on moving platforms
    const hasSpikeHere = spikes.some(s => s.x>=newX && s.x<newX+newW);
    if (!isLast && !platObj.moving && !hasSpikeHere && Math.random() < diff.coinChance) {
      const cc = randInt(1,2);
      const sp = newW/(cc+1);
      for (let c=0;c<cc;c++) coins.push({
        x:newX+sp*(c+1)-7, y:newY-28, w:14, h:14,
        collected:false, bobOffset:Math.random()*Math.PI*2,
      });
    }
  }

  if (platforms.length < CFG.minPlats) return null;

  // ── Door on last platform, well-centered, nothing near it ───────────
  const last = platforms[platforms.length-1];
  const door = {x:last.x+last.w/2-18, y:last.y-44, w:36, h:44};

  // Remove platforms stacked too close below the door platform
  // (keep first and last, clean up any mid platforms in the door's column)
  const doorPlat = last;
  const cleanPlatforms = platforms.filter((p, idx) => {
    if (idx === 0 || idx === platforms.length-1) return true; // always keep start+end
    const inDoorColumn = p.x < doorPlat.x+doorPlat.w+10 && p.x+p.w > doorPlat.x-10;
    const tooClose     = p.y > doorPlat.y - 5 && p.y < doorPlat.y + 130;
    return !(inDoorColumn && tooClose);
  });

  // Remove any spikes / coins / fallers that are inside or near the door
  const filteredSpikes = spikes.filter(s => !nearDoor(s, door));
  const filteredCoins  = coins.filter(c => !nearDoor(c, door));

  // Spawn at start platform, a few px from the edge
  const first = platforms[0];
  const spawnX = layout === "rl" || layout === "bu"
    ? first.x + first.w - CFG.pSize - 10
    : first.x + 14;
  const spawn = {x:spawnX, y:first.y - CFG.pSize};

  // Invisible wall on the "wrong" side of the spawn platform.
  // dirX > 0 (lr/mix): player should go RIGHT  → wall on the LEFT edge
  // dirX < 0 (rl/bu):  player should go LEFT   → wall on the RIGHT edge
  const wallOnLeft = (layout === "lr" || layout === "mix");
  const spawnWall = wallOnLeft
    ? {x: first.x - 24, y: first.y - 120, w: 24, h: 120}   // left side
    : {x: first.x + first.w, y: first.y - 120, w: 24, h: 120}; // right side

  // Final reachability guard — BFS on the cleaned platform list
  if (!isReachable(cleanPlatforms, diff)) return null;

  return {platforms:cleanPlatforms, spikes:filteredSpikes, coins:filteredCoins,
          fallers:[], spawn, spawnWall, door, biome, layout};
}

// ── Reachability check ───────────────────────────────────────────────────
// Can the player jump from platform A to platform B?
// Uses conservative physics estimates.
function canReach(a, b, diff) {
  const reach = jumpReach(diff);
  // Horizontal distance between nearest edges
  const horizGap = Math.max(0, b.x - (a.x+a.w), a.x - (b.x+b.w));
  // Vertical: positive = B is above A
  const vertDiff = a.y - b.y;  // positive means B is higher than A
  if (horizGap > reach.maxH) return false;
  if (vertDiff >  reach.maxU) return false; // B too high to jump to
  if (vertDiff < -reach.maxD) return false; // B too far below (deadly fall)
  return true;
}

// BFS: can player reach door platform from spawn platform?
function isReachable(platforms, diff) {
  if (platforms.length < 2) return false;
  const visited = new Set([0]);
  const queue   = [0];
  const goal    = platforms.length - 1;
  while (queue.length) {
    const cur = queue.shift();
    if (cur === goal) return true;
    for (let j=0; j<platforms.length; j++) {
      if (visited.has(j)) continue;
      if (canReach(platforms[cur], platforms[j], diff) ||
          canReach(platforms[j], platforms[cur], diff)) {
        visited.add(j);
        queue.push(j);
      }
    }
  }
  return visited.has(goal);
}

function generateLevel(lvl) {
  const diff = difficulty(lvl);
  for (let a=0; a<120; a++) {
    const c = tryGenerateLevel(lvl);
    if (!c || c.platforms.length < CFG.minPlats) continue;
    if (isReachable(c.platforms, diff)) return c;
  }
  // Guaranteed fallback — evenly spaced, always reachable
  const biome = getBiome(lvl);
  const platforms=[];
  const n = 6;
  const stepX = Math.floor((CFG.W - 100) / (n-1));
  for (let i=0;i<n;i++) {
    platforms.push({
      x: 40 + i*stepX,
      y: CFG.groundY - 80 - i*28,
      w: 110, h: CFG.platH,
      color: i%biome.platform.length, biome
    });
  }
  const last = platforms[n-1];
  const door  = {x:last.x+last.w/2-18, y:last.y-44, w:36, h:44};
  const spawn = {x:platforms[0].x+14, y:platforms[0].y-CFG.pSize};
  const fbWall = {x: platforms[0].x - 24, y: platforms[0].y - 120, w: 24, h: 120};
  return {platforms, spikes:[], coins:[], fallers:[], spawn, spawnWall:fbWall, door, biome, layout:"lr"};
}

// =========================================================================
// MOVING PLATFORMS  update
// =========================================================================
function updateMovingPlatforms(platforms) {
  for (const plat of platforms) {
    if (!plat.moving) continue;
    const m = plat.moving;
    m.t += 0.02;
    if (m.axis === "h") {
      plat.x = m.origin + Math.sin(m.t) * m.range;
    } else {
      plat.y = m.origin + Math.sin(m.t) * m.range;
    }
  }
}


// =========================================================================
// PLAYER
// =========================================================================
function createPlayer(spawn) {
  return {
    x:spawn.x, y:spawn.y, w:CFG.pSize, h:CFG.pSize,
    vx:0, vy:0, onGround:false, wasOnGround:false,
    facing:1, animT:0, landSquash:0, slideDust:[],
    coyoteTime:0, jumpBuffer:0,
    prevY:0,           // Y before current frame move (for one-way collision)
    standingOn:null,   // reference to moving platform player is on
  };
}

function updatePlayer(p) {
  // Carry from moving platform
  if (p.standingOn && p.standingOn.moving) {
    const m = p.standingOn.moving;
    if (m.axis==="h") p.x += Math.cos(m.t)*m.range*0.02*Math.abs(m.speed)*0.6;
    else p.y += Math.cos(m.t)*m.range*0.02*Math.abs(m.speed)*0.4;
  }
  p.standingOn = null;

  if (keys.left)  { p.vx-=CFG.moveAccel; p.facing=-1; }
  if (keys.right) { p.vx+=CFG.moveAccel; p.facing= 1; }
  if (!keys.left&&!keys.right) { p.vx*=p.onGround?CFG.groundFric:CFG.airFric; if(Math.abs(p.vx)<0.04)p.vx=0; }
  p.vx=Math.max(-CFG.moveSpeed,Math.min(CFG.moveSpeed,p.vx));

  if (p.onGround) p.coyoteTime=6; else if(p.coyoteTime>0) p.coyoteTime--;
  if (keys.up) p.jumpBuffer=8; else if(p.jumpBuffer>0) p.jumpBuffer--;
  if (p.jumpBuffer>0&&p.coyoteTime>0&&p.vy>=-1) {
    p.vy=CFG.jumpForce; p.coyoteTime=0; p.jumpBuffer=0; sfxJump();
  }
  if (!keys.up&&p.vy<0&&p.vy>CFG.jumpCutVy) p.vy=Math.max(p.vy*0.88,CFG.jumpCutVy);
  p.vy+=p.vy<0?(keys.up?CFG.gravUp:CFG.gravUp*1.15):CFG.gravFall;
  if(p.vy>CFG.maxFall) p.vy=CFG.maxFall;
  p.prevY = p.y;   // remember pre-move Y for one-way collision
  p.x+=p.vx; p.y+=p.vy;
  if(p.x<0){p.x=0;p.vx*=0.35;} if(p.x+p.w>CFG.W){p.x=CFG.W-p.w;p.vx*=0.35;}
}

function updatePlayerMotionFx(p) {
  if(p.landSquash>0) p.landSquash--;
  if(p.onGround&&Math.abs(p.vx)>0.35) p.animT+=0.14+Math.abs(p.vx)*0.04; else p.animT*=0.85;
  const sliding=p.onGround&&!keys.left&&!keys.right&&Math.abs(p.vx)>0.5;
  if(sliding&&Math.random()<0.35) p.slideDust.push({x:p.x+(p.vx>0?2:p.w-2),y:p.y+p.h-3,life:14,drift:-p.vx*0.25});
  p.slideDust=p.slideDust.filter(d=>{d.x+=d.drift;d.life--;return d.life>0;});
}

function playerFellInPit(p){ return p.y+p.h>=CFG.pitY; }

function resetPlayerToSpawn() {
  player.x=level.spawn.x; player.y=level.spawn.y;
  player.vx=0; player.vy=0; player.onGround=false; player.wasOnGround=false;
  player.landSquash=0; player.slideDust=[]; player.animT=0; player.coyoteTime=0; player.jumpBuffer=0;
  player.prevY=player.y; player.standingOn=null;
}

// =========================================================================
// COLLISIONS
// =========================================================================
function rectsOverlap(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }

function resolveWallCollision(p, wall) {
  if (!wall) return;
  if (!rectsOverlap(p, wall)) return;
  // Push player out horizontally only
  const overlapLeft  = p.x + p.w - wall.x;
  const overlapRight = wall.x + wall.w - p.x;
  if (overlapLeft < overlapRight) { p.x = wall.x - p.w; }
  else                            { p.x = wall.x + wall.w; }
  p.vx = 0;
}

function resolvePlatformCollisions(p, platforms) {
  p.onGround=false;
  for (const plat of platforms) {
    if (!rectsOverlap(p,plat)) continue;

    // One-way: only land when player was above the platform top last frame
    // and is now moving downward (or zero). Jumping up passes through.
    const feetWasAbove = p.prevY + p.h <= plat.y + 3; // prevY set in gameLoop before move
    if (p.vy < 0 || !feetWasAbove) continue;

    p.y = plat.y - p.h;
    if (p.vy > 2) p.landSquash = 12;
    p.vy = 0; p.onGround = true; p.standingOn = plat;
  }
}

function checkCoinPickups(p) {
  for (const coin of level.coins) {
    if (!coin.collected&&rectsOverlap(p,coin)) {
      coin.collected=true; score+=CFG.coinValue; totalCoins++;
      spawnParticles(coin.x+7,coin.y+7,currentBiome.accent,8,2.5);
      sfxCoin(); updateHud();
    }
  }
}


// =========================================================================
// RENDERING
// =========================================================================
function drawBackground(time) {
  const b = currentBiome;
  ctx.fillStyle = b.bg;
  ctx.fillRect(0,0,CFG.W,CFG.H);

  if (b.bgStars) {
    for (const s of stars) {
      s.twinkle+=0.018;
      ctx.globalAlpha=s.alpha*(0.7+0.3*Math.sin(s.twinkle));
      ctx.fillStyle="#e8eaed";
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  if (b.name==="Forest") {
    // Silhouette trees in background
    ctx.fillStyle="rgba(10,35,10,0.55)";
    for (let tx=20; tx<CFG.W; tx+=55) {
      const th = 60+Math.sin(tx*0.07)*20;
      ctx.beginPath();
      ctx.moveTo(tx, CFG.groundY);
      ctx.lineTo(tx+14, CFG.groundY-th);
      ctx.lineTo(tx+28, CFG.groundY);
      ctx.closePath(); ctx.fill();
    }
  }
  if (b.name==="Volcano") {
    // Lava glow at bottom
    const g=ctx.createLinearGradient(0,CFG.groundY-10,0,CFG.H);
    g.addColorStop(0,"rgba(180,30,0,0)"); g.addColorStop(1,"rgba(255,80,0,0.38)");
    ctx.fillStyle=g; ctx.fillRect(0,CFG.groundY-10,CFG.W,CFG.H-CFG.groundY+10);
    // Floating embers
    for (const s of stars) {
      const flicker=0.5+0.5*Math.sin(s.twinkle*1.3+time*0.001);
      ctx.globalAlpha=s.alpha*flicker*0.6;
      ctx.fillStyle="#fb923c";
      ctx.beginPath(); ctx.arc(s.x,CFG.H-s.y*0.5,s.r*0.8,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if (b.name==="Dungeon") {
    // Stone wall pattern
    ctx.strokeStyle="rgba(255,255,255,0.025)"; ctx.lineWidth=1;
    for (let gy=0;gy<CFG.H;gy+=40){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(CFG.W,gy);ctx.stroke();}
    for (let row=0;row<CFG.H/40;row++) {
      const off=(row%2)*20;
      for (let gx=off;gx<CFG.W;gx+=40){ctx.beginPath();ctx.moveTo(gx,row*40);ctx.lineTo(gx,row*40+40);ctx.stroke();}
    }
    // Torches
    for (let tx=80;tx<CFG.W;tx+=160) {
      const fl=0.7+0.3*Math.sin(time*0.007+tx);
      ctx.globalAlpha=fl*0.18;
      ctx.fillStyle="#f97316";
      ctx.beginPath(); ctx.arc(tx,60,18,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle="#f97316";
      ctx.fillRect(tx-3,52,6,14);
      ctx.fillStyle="#fbbf24";
      ctx.beginPath(); ctx.moveTo(tx,48); ctx.lineTo(tx+5,58); ctx.lineTo(tx-5,58); ctx.closePath(); ctx.fill();
    }
  }
  if (b.bgGrid) {
    ctx.strokeStyle="rgba(255,255,255,0.022)"; ctx.lineWidth=1;
    for (let gx=0;gx<CFG.W;gx+=40){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,CFG.H);ctx.stroke();}
    for (let gy=0;gy<CFG.H;gy+=40){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(CFG.W,gy);ctx.stroke();}
  }

  // Pit gradient
  const pitG=ctx.createLinearGradient(0,CFG.groundY-20,0,CFG.H);
  pitG.addColorStop(0,"rgba(0,0,0,0)"); pitG.addColorStop(1,b.pitColor);
  ctx.fillStyle=pitG; ctx.fillRect(0,CFG.groundY-20,CFG.W,CFG.H-CFG.groundY+20);
}

function drawPlatforms(platforms) {
  for (const plat of platforms) {
    const b = plat.biome || currentBiome;
    const col = b.platform[plat.color % b.platform.length];
    ctx.fillStyle=col;
    ctx.fillRect(plat.x,plat.y,plat.w,plat.h);
    // Highlight
    ctx.fillStyle="rgba(255,255,255,0.14)";
    ctx.fillRect(plat.x,plat.y,plat.w,3);
    // Moving platform indicator — pulsing edges
    if (plat.moving) {
      ctx.strokeStyle="rgba(255,255,255,0.35)";
      ctx.lineWidth=1;
      ctx.strokeRect(plat.x,plat.y,plat.w,plat.h);
    }
  }
}

function drawSpikes(spikes) {
  const b = currentBiome;
  ctx.shadowColor = b.spikeGlow; ctx.shadowBlur = 6;
  ctx.fillStyle = b.spike;
  for (const s of spikes) {
    ctx.beginPath();
    ctx.moveTo(s.x+s.w/2, s.y);
    ctx.lineTo(s.x+s.w, s.y+s.h);
    ctx.lineTo(s.x, s.y+s.h);
    ctx.closePath(); ctx.fill();
  }
  ctx.shadowBlur=0;
}


function drawCoins(coins, time) {
  for (const coin of coins) {
    if (coin.collected) continue;
    const bob=Math.sin(time*0.003+coin.bobOffset)*3;
    const cx=coin.x+7, cy=coin.y+7+bob;
    ctx.shadowColor="rgba(251,191,36,0.55)"; ctx.shadowBlur=8;
    ctx.fillStyle="#fbbf24";
    ctx.beginPath(); ctx.arc(cx,cy,7,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="rgba(255,255,255,0.45)";
    ctx.beginPath(); ctx.arc(cx-2,cy-2,2.5,0,Math.PI*2); ctx.fill();
  }
}

function drawSpawn(spawn) {
  ctx.strokeStyle="#94a3b8"; ctx.lineWidth=2; ctx.setLineDash([4,4]);
  ctx.strokeRect(spawn.x-4,spawn.y-4,CFG.pSize+8,CFG.pSize+8);
  ctx.setLineDash([]);
}

function drawDoor(door, time) {
  const pulse=0.5+0.5*Math.sin(time*0.006);
  ctx.shadowColor=currentBiome.accent; ctx.shadowBlur=12+pulse*16;
  ctx.fillStyle="rgba(251,191,36,0.4)";
  ctx.fillRect(door.x-6,door.y-6,door.w+12,door.h+12);
  ctx.fillStyle="#fbbf24";
  ctx.fillRect(door.x,door.y,door.w,door.h);
  ctx.fillStyle="#1a1408";
  ctx.fillRect(door.x+10,door.y+8,door.w-20,door.h-16);
  ctx.shadowBlur=0;
  ctx.strokeStyle=`rgba(255,255,255,${0.3+pulse*0.4})`; ctx.lineWidth=2;
  ctx.strokeRect(door.x,door.y,door.w,door.h);
}

function drawPlayer(p) {
  let dw=p.w,dh=p.h,dx=p.x,dy=p.y;
  if(p.vy<-0.8){dh=p.h*0.9;dw=p.w*1.07;dy+=p.h-dh;}
  else if(p.vy>0.8){dh=p.h*1.06;dw=p.w*0.93;dy-=dh-p.h;}
  if(p.landSquash>0){const s=1+p.landSquash*0.018;dw*=s;dh/=s;dy+=p.h-dh;}
  if(p.onGround&&Math.abs(p.vx)>0.12) dy+=Math.sin(p.animT)*1.8;
  const lean=Math.max(-0.14,Math.min(0.14,p.vx*0.055));
  for(const d of p.slideDust){ctx.fillStyle=`rgba(148,163,184,${(d.life/14)*0.5})`;ctx.fillRect(d.x,d.y,4,3);}
  ctx.save();
  ctx.translate(dx+dw/2,dy+dh); ctx.rotate(lean);
  ctx.fillStyle=deathFlash>0?"#f87171":"#38bdf8";
  ctx.fillRect(-dw/2,-dh,dw,dh);
  ctx.fillStyle="rgba(255,255,255,0.35)";
  ctx.fillRect(p.facing>0?4:-12,-dh+6,8,8);
  ctx.restore();
}

function render(time) {
  drawBackground(time);
  drawPlatforms(level.platforms);
  drawSpikes(level.spikes);
  drawCoins(level.coins, time);
  drawSpawn(level.spawn);
  drawDoor(level.door, time);
  drawPlayer(player);
  drawParticles();
  if(deathFlash>0){ctx.fillStyle=`rgba(239,68,68,${deathFlash*0.32})`;ctx.fillRect(0,0,CFG.W,CFG.H);}
}

// =========================================================================
// SHOP
// =========================================================================
const shopOverlay   = document.getElementById("shop-overlay");
const shopCoinsLbl  = document.getElementById("shop-coins-label");
const shopLifeBtn   = document.getElementById("shop-life");
const shopSkipBtn   = document.getElementById("shop-skip");
const shopCloseBtn  = document.getElementById("shop-close");
const shieldPip     = document.getElementById("shield-pip");

function openShop() {
  shopOpen = true;
  shopCoinsLbl.textContent = `You have ${totalCoins} coin${totalCoins!==1?"s":""}`;
  shopLifeBtn.classList.toggle("disabled", totalCoins < 5 || lives >= CFG.maxLives);
  shopSkipBtn.classList.toggle("disabled", totalCoins < 15);
  shopOverlay.classList.add("active");
}

function closeShop() {
  shopOpen = false;
  shopOverlay.classList.remove("active");
  startLevel(false); // levelNumber already bumped before openShop() was called
}

shopLifeBtn.addEventListener("click", () => {
  if (totalCoins < 5 || lives >= CFG.maxLives) return;
  totalCoins -= 5; lives = Math.min(lives+1, CFG.maxLives);
  updateHud();
  shopCoinsLbl.textContent = `You have ${totalCoins} coin${totalCoins!==1?"s":""}`;
  shopLifeBtn.classList.toggle("disabled", totalCoins < 5 || lives >= CFG.maxLives);
  shopSkipBtn.classList.toggle("disabled", totalCoins < 15);
  sfxCoin();
});

shopSkipBtn.addEventListener("click", () => {
  if (totalCoins < 15) return;
  totalCoins -= 15; skipTokens++;
  updateHud(); updateSkipBtn();
  shopCoinsLbl.textContent = `You have ${totalCoins} coin${totalCoins!==1?"s":""}`;
  shopSkipBtn.classList.toggle("disabled", totalCoins < 15);
  sfxCoin();
});

shopCloseBtn.addEventListener("click", () => closeShop());

// =========================================================================
// TIMER
// =========================================================================
const timerWrap = document.getElementById("timer-wrap");
const timerBar  = document.getElementById("timer-bar");
const banner    = document.getElementById("level-banner");

function startTimer(seconds) {
  timerSeconds = seconds; timerMs = 0; timerActive = true;
  timerWrap.classList.add("active");
  timerBar.style.width = "100%";
  timerBar.style.background = "#38bdf8";
}

function stopTimer() {
  timerActive = false;
  timerWrap.classList.remove("active");
}

function updateTimer(dt) {
  if (!timerActive || isDead || levelTransition || shopOpen) return;
  timerMs += dt;
  const elapsed = timerMs / 1000;
  const remaining = Math.max(0, timerSeconds - elapsed);
  const pct = remaining / timerSeconds;
  timerBar.style.width = (pct * 100) + "%";
  timerBar.style.background = pct > 0.4 ? "#38bdf8" : pct > 0.2 ? "#fbbf24" : "#ef4444";
  if (remaining <= 0) { stopTimer(); killPlayer(); }
}

function showBanner(text, color) {
  banner.textContent = text;
  banner.style.color = color || "#e8eaed";
  banner.style.borderColor = color ? color+"55" : "rgba(255,255,255,0.12)";
  banner.classList.add("active");
  setTimeout(() => banner.classList.remove("active"), 3000);
}

// =========================================================================
// SPECIAL LEVEL PICKER
// =========================================================================
function pickSpecialType(lvl) {
  // Timer levels every 5th (but not on shop levels every 10th)
  const mod = (lvl-1) % 10;
  if (mod === 4) return "timer";
  return "normal";
}

// For treasure levels: override generation to have many coins, no spikes/fallers

// =========================================================================
// GAME FLOW
// =========================================================================
function startLevel(advance) {
  levelTransition=false; isDead=false; deathFlash=0;
  stopTimer();
  if (advance) { levelNumber++; score+=50; }

  specialType = pickSpecialType(levelNumber);

  if (specialType === "timer") {
    level = generateLevel(levelNumber);
    showBanner("⚡ Hurry! Beat the clock!", "#38bdf8");
    startTimer(22);
  } else {
    level = generateLevel(levelNumber);
  }

  if (currentBiome.name !== level.biome.name) startMusic(level.biome.name.toLowerCase());
  currentBiome = level.biome;
  player = createPlayer(level.spawn);
  updateHud();
}

function killPlayer() {
  if (isDead||levelTransition) return;
  if (hasShield) {
    hasShield=false;
    shieldPip.classList.remove("active");
    deathFlash=0.6;
    spawnParticles(player.x+player.w/2,player.y+player.h/2,"#38bdf8",10,2.5);
    setTimeout(()=>{ deathFlash=0; resetPlayerToSpawn(); },280);
    return;
  }
  isDead=true; deathFlash=1; lives--;
  updateHud();
  spawnParticles(player.x+player.w/2,player.y+player.h/2,"#f87171",14,3);
  sfxDeath();
  if(lives<=0){setTimeout(showGameOver,420);return;}
  setTimeout(()=>{resetPlayerToSpawn();deathFlash=0;isDead=false;},380);
}

function completeLevel() {
  if(levelTransition||isDead) return;
  levelTransition=true;
  stopTimer();
  sfxWin();
  spawnParticles(level.door.x+18,level.door.y+22,currentBiome.accent,20,3.5);
  setTimeout(()=>{
    ctx.fillStyle=currentBiome.bg; ctx.fillRect(0,0,CFG.W,CFG.H);
    levelNumber++;  // bump here so shop shows correct "next level" number
    score+=50;
    // Every 10 levels → shop before continuing
    if (levelNumber % 10 === 1 && levelNumber > 1) {
      levelTransition=false;
      openShop();
    } else {
      startLevel(false);  // false = don't bump level again
    }
  },320);
}

function showGameOver() {
  gameOver=true;
  if(score>record){record=score;localStorage.setItem("pfRecord",record);}
  ovTitle.textContent="GAME OVER"; ovTitle.style.color="#f87171";
  ovSub.textContent=`You reached level ${levelNumber} · ${currentBiome.name}`;
  ovScore.textContent=`Score: ${score}  ·  Coins: ${totalCoins}`;
  ovRecord.textContent=`Best: ${record}`;
  overlay.classList.add("active");
  sfxGameOver();
}

function fullRestart() {
  gameOver=false;isDead=false;deathFlash=0;levelTransition=false;
  lives=CFG.maxLives;levelNumber=1;score=0;totalCoins=0;particles=[];
  shopOpen=false; hasShield=false; specialType="normal"; skipTokens=0; updateSkipBtn();
  shopOverlay.classList.remove("active");
  shieldPip.classList.remove("active");
  stopTimer();
  overlay.classList.remove("active");
  startLevel(false);
}
restartBtn.addEventListener("click",fullRestart);

// Skip token button
const skipBtn  = document.getElementById("skip-btn");
const skipCountEl = document.getElementById("skipCount");
function updateSkipBtn() {
  skipCountEl.textContent = skipTokens;
  skipBtn.style.display = skipTokens > 0 ? "inline-block" : "none";
}
skipBtn.addEventListener("click", () => {
  if (skipTokens <= 0 || isDead || levelTransition || shopOpen || gameOver) return;
  skipTokens--; updateSkipBtn();
  sfxWin();
  completeLevel();
});

// =========================================================================
// MAIN LOOP
// =========================================================================
let lastTime = 0;
function gameLoop(time) {
  const dt = lastTime ? Math.min(time - lastTime, 50) : 16;
  lastTime = time;

  if (!gameOver && !levelTransition && !shopOpen) {
    updateTimer(dt);
    player.wasOnGround=player.onGround;
    updateMovingPlatforms(level.platforms);
    updatePlayer(player);
    resolvePlatformCollisions(player,level.platforms);
    resolveWallCollision(player, level.spawnWall);
    if(player.onGround&&!player.wasOnGround) player.landSquash=Math.max(player.landSquash,10);
    updatePlayerMotionFx(player);
    updateParticles();
    checkCoinPickups(player);

    if      (playerFellInPit(player))                            killPlayer();
    else if (!isDead&&level.spikes.some(s=>rectsOverlap(player,s))) killPlayer();
    else if (!isDead&&rectsOverlap(player,level.door))              completeLevel();

    if(deathFlash>0) deathFlash=Math.max(0,deathFlash-0.08);
  } else if (!gameOver&&levelTransition) {
    updateParticles();
  }
  if (!levelTransition||gameOver) render(time);
  else if (particles.length>0) {
    ctx.fillStyle=currentBiome.bg; ctx.fillRect(0,0,CFG.W,CFG.H);
    drawParticles();
  }
  requestAnimationFrame(gameLoop);
}

// =========================================================================
// INPUT
// =========================================================================
window.addEventListener("keydown",e=>{
  if(e.code==="ArrowLeft" ||e.code==="KeyA") keys.left =true;
  if(e.code==="ArrowRight"||e.code==="KeyD") keys.right=true;
  if(e.code==="ArrowUp"   ||e.code==="KeyW"||e.code==="Space") keys.up=true;
  if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup",e=>{
  if(e.code==="ArrowLeft" ||e.code==="KeyA") keys.left =false;
  if(e.code==="ArrowRight"||e.code==="KeyD") keys.right=false;
  if(e.code==="ArrowUp"   ||e.code==="KeyW"||e.code==="Space") keys.up=false;
});
function bindMob(id,key){
  const el=document.getElementById(id);if(!el)return;
  const on =e=>{e.preventDefault();keys[key]=true; el.classList.add("pressed");};
  const off=e=>{e.preventDefault();keys[key]=false;el.classList.remove("pressed");};
  el.addEventListener("touchstart", on, {passive:false});
  el.addEventListener("touchend",   off,{passive:false});
  el.addEventListener("touchcancel",off,{passive:false});
  el.addEventListener("mousedown",on);el.addEventListener("mouseup",off);el.addEventListener("mouseleave",off);
}
bindMob("mob-left","left"); bindMob("mob-right","right"); bindMob("mob-jump","up");

document.addEventListener("pointerdown",()=>{getAC();startMusic(currentBiome.name.toLowerCase());},{once:true});

// =========================================================================
// BOOT
// =========================================================================
startLevel(false);
requestAnimationFrame(gameLoop);
</script>
</body>
