<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="MrMidnight">
  <title>Platformer · MrMidnight</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.55rem;
      background: #0d0f14; color: #e8eaed;
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 1rem; user-select: none;
      width: 100%;
    }
    h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: 0.04em; }
    .hud {
      display: flex; gap: 1.2rem; font-size: 0.95rem;
      font-variant-numeric: tabular-nums; color: #9aa0a6; align-items: center;
      flex-wrap: wrap; justify-content: center; max-width: 100%;
    }
    .hud strong { color: #e8eaed; margin-left: 0.3rem; }
    #biomeLabel { font-size: 0.8rem; color: #6b7280; font-style: italic; }
    .lives { display: flex; gap: 4px; align-items: center; }
    .heart { font-size: 1rem; } .heart.lost { opacity: 0.22; }
    #game {
      display: block; border: 2px solid #2a3140; border-radius: 4px;
      background: #12151c; box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      image-rendering: pixelated; touch-action: none;
      max-width: 100%; height: auto; /* scale down to fit viewport */
    }
    .vol-row { display: flex; gap: 1.2rem; align-items: center; font-size: 0.8rem; color: #6b7280; }
    .vol-row label { display: flex; align-items: center; gap: 0.45rem; white-space: nowrap; }
    .vol-row input[type=range] { width: 90px; height: 4px; accent-color: #38bdf8; cursor: pointer; }
    .vol-val { font-variant-numeric: tabular-nums; min-width: 28px; color: #9aa0a6; }
    .hint { font-size: 0.8rem; color: #6b7280; text-align: center; max-width: 640px; line-height: 1.45; }
    .credit { font-size: 0.8rem; color: #6b7280; }
    .credit a { color: #9aa0a6; text-decoration: none; }
    .credit a:hover { color: #e8eaed; text-decoration: underline; }
    #mobile-controls { display: none; gap: 8px; margin-top: 2px; }
    .mob-btn {
      width: 58px; height: 52px; background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.13); border-radius: 8px;
      color: #cdd5e0; font-size: 1.35rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s; -webkit-tap-highlight-color: transparent;
    }
    .mob-btn:active, .mob-btn.pressed { background: rgba(255,255,255,0.15); }
    #mob-jump { width: 72px; font-size: 1.5rem; }
    @media (pointer: coarse) { #mobile-controls { display: flex; } .hint span.kb-hint { display: none; } }
    #canvas-wrap { position: relative; display: inline-block; line-height: 0; max-width: 100%; }
    #overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(13,15,20,0.9); border-radius: 4px;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 0.85rem; z-index: 10;
      line-height: 1.4; /* reset — #canvas-wrap sets line-height:0 which collapses text */
    }
    #overlay.active { display: flex; }
    #overlay h2 { font-size: 2rem; font-weight: 700; letter-spacing: 0.05em; }
    #overlay .ov-sub   { font-size: 1rem;    color: #9aa0a6; }
    #overlay .ov-score { font-size: 1.15rem; color: #e8eaed; }
    #overlay .ov-record{ font-size: 0.9rem;  color: #fbbf24; }

    #leaderboard {
      display: flex; flex-direction: column; gap: 4px;
      width: 240px; max-height: 220px; overflow: hidden;
      margin-top: 0.2rem;
    }
    .lb-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.3rem 0.7rem; border-radius: 6px;
      background: rgba(255,255,255,0.04);
      font-size: 0.85rem; color: #9aa0a6;
      transition: background 0.4s, transform 0.4s, opacity 0.4s;
    }
    .lb-row.lb-new {
      background: rgba(251,191,36,0.16); color: #fbbf24;
      animation: lbPop 0.5s ease;
    }
    .lb-rank { width: 22px; color: #6b7280; font-variant-numeric: tabular-nums; }
    .lb-name { flex: 1; text-align: left; padding-left: 4px; color: #cdd5e0; }
    .lb-score { font-variant-numeric: tabular-nums; font-weight: 600; }
    @keyframes lbPop {
      0% { transform: scale(0.92); opacity: 0.4; }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); opacity: 1; }
    }
    #restart-btn {
      margin-top: 0.4rem; padding: 0.6rem 2.2rem; background: #38bdf8;
      color: #0d0f14; border: none; border-radius: 6px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      letter-spacing: 0.03em; transition: background 0.15s, transform 0.1s;
    }
    #restart-btn:hover  { background: #7dd3fc; }
    #restart-btn:active { transform: scale(0.96); }

    /* ── Leaderboard (shown on Game Over) ── */
    #leaderboard {
      display: flex; flex-direction: column; gap: 4px;
      width: 240px; max-height: 220px; overflow-y: auto;
      padding: 0.4rem; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    }
    .lb-row {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.28rem 0.5rem; border-radius: 6px;
      font-size: 0.85rem; color: #9aa0a6;
      background: rgba(255,255,255,0.02);
      transition: transform 0.5s cubic-bezier(0.34,1.2,0.64,1), background 0.4s, color 0.4s;
    }
    .lb-row .lb-rank  { width: 1.4rem; text-align: right; color: #6b7280; font-variant-numeric: tabular-nums; }
    .lb-row .lb-score { flex: 1; text-align: left; font-variant-numeric: tabular-nums; }
    .lb-row.lb-new {
      background: rgba(56,189,248,0.16);
      color: #e8eaed; font-weight: 600;
      box-shadow: 0 0 0 1px rgba(56,189,248,0.35) inset;
    }
    .lb-row.lb-new .lb-rank { color: #38bdf8; }
    .lb-row.lb-top1 .lb-rank { color: #fbbf24; }

    /* ── Shop overlay ── */
    #shop-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(10,12,18,0.96); border-radius: 4px;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 1.1rem; z-index: 20;
      line-height: 1.4; /* reset — #canvas-wrap sets line-height:0 which collapses text */
    }
    #shop-overlay.active { display: flex; }
    #shop-overlay h2 { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.05em; color: #fbbf24; }
    #shop-overlay .shop-sub { font-size: 0.9rem; color: #6b7280; }
    .shop-items { display: flex; gap: 1rem; }
    .shop-item {
      background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 1.1rem 1.4rem;
      display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
      cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s;
      min-width: 130px;
    }
    .shop-item:hover  { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.25); }
    .shop-item:active { transform: scale(0.96); }
    .shop-item.disabled { opacity: 0.38; cursor: not-allowed; pointer-events: none; }
    .shop-item .si-icon  { font-size: 2rem; }
    .shop-item .si-name  { font-size: 0.9rem; color: #e8eaed; font-weight: 600; }
    .shop-item .si-cost  { font-size: 0.82rem; color: #fbbf24; }
    .shop-item .si-desc  { font-size: 0.75rem; color: #6b7280; text-align: center; }
    #shop-skip { margin-top: 0.2rem; background: transparent; border: 1.5px solid #374151;
      color: #6b7280; border-radius: 6px; padding: 0.45rem 1.6rem;
      font-size: 0.88rem; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
    #shop-skip:hover { border-color: #9aa0a6; color: #e8eaed; }

    /* ── Timer bar ── */
    #timer-wrap {
      display: none; position: absolute; left: 0; right: 0; top: 0; height: 5px; z-index: 5;
    }
    #timer-wrap.active { display: block; }
    #timer-bar { height: 100%; width: 100%; background: #38bdf8; transition: background 0.3s; border-radius: 0 0 2px 2px; }

    /* ── Special level banner ── */
    #level-banner {
      display: none; position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      background: rgba(10,12,18,0.88); border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 8px; padding: 0.4rem 1.1rem; font-size: 0.88rem;
      color: #e8eaed; letter-spacing: 0.03em; z-index: 6; white-space: nowrap;
      pointer-events: none;
    }
    #level-banner.active { display: block; }

    /* ── Shield pip in HUD ── */
    #shield-pip { display: none; font-size: 1rem; }
    #shield-pip.active { display: inline; }

    /* ── Small / portrait screens — game fills viewport width ── */
    @media (max-width: 760px) {
      body { padding: 0.5rem; gap: 0.4rem; }
      h1 { font-size: 1.1rem; }
      .hud { font-size: 0.8rem; gap: 0.6rem; }
      #biomeLabel { display: none; } /* save space */
      .hint, .credit, .vol-row { font-size: 0.7rem; }
      .vol-row { gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
      .vol-row input[type=range] { width: 70px; }
      #canvas-wrap, #game { width: 100%; }
    }

    /* ── Landscape on short viewports — limit height instead of width ── */
    @media (orientation: landscape) and (max-height: 480px) {
      body { padding: 0.3rem; gap: 0.25rem; }
      h1 { display: none; }
      .hud { font-size: 0.75rem; gap: 0.5rem; }
      .hint { display: none; }
      .credit { display: none; }
      .vol-row { font-size: 0.65rem; gap: 0.5rem; }
      #canvas-wrap, #game { max-height: 78vh; width: auto; }
      #game { max-width: 100%; height: 78vh; width: auto; }
    }
  </style>
</head>
<body>
  <h1>Platformer</h1>
  <div class="hud">
    <span>Level<strong id="levelDisplay">1</strong></span>
    <span>Score<strong id="scoreDisplay">0</strong></span>
    <span>Best<strong id="bestDisplay">0</strong></span>
    <span>🪙<strong id="coinsDisplay">0</strong></span>
    <span id="biomeLabel">Space</span>
    <span id="shield-pip">🛡</span>
    <button id="skip-btn" title="Use skip token" style="display:none;background:rgba(251,191,36,0.15);border:1.5px solid #fbbf24;color:#fbbf24;border-radius:6px;padding:0.18rem 0.55rem;font-size:0.8rem;cursor:pointer;line-height:1.3;">⏭ Skip (<span id="skipCount">0</span>)</button>
    <span class="lives">
      <span class="heart" id="h1">❤️</span>
      <span class="heart" id="h2">❤️</span>
      <span class="heart" id="h3">❤️</span>
    </span>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="1100" height="540" aria-label="Platformer game"></canvas>
    <div id="timer-wrap"><div id="timer-bar"></div></div>
    <div id="level-banner"></div>
    <div id="shop-overlay">
      <h2>🏪 Shop</h2>
      <p class="shop-sub" id="shop-coins-label">You have 0 coins</p>
      <div class="shop-items">
        <div class="shop-item" id="shop-life">
          <span class="si-icon">❤️</span>
          <span class="si-name">Extra Life</span>
          <span class="si-cost">5 coins</span>
          <span class="si-desc">+1 life (max 3)</span>
        </div>
        <div class="shop-item" id="shop-skip">
          <span class="si-icon">⏭</span>
          <span class="si-name">Skip Level</span>
          <span class="si-cost">15 coins</span>
          <span class="si-desc">Saves a skip token</span>
        </div>
      </div>
      <button id="shop-close">Continue →</button>
    </div>
    <div id="overlay">
      <h2 id="ov-title">GAME OVER</h2>
      <p class="ov-sub"   id="ov-sub"></p>

      <div id="leaderboard"></div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <div id="mobile-controls">
    <button class="mob-btn" id="mob-left">◀</button>
    <button class="mob-btn" id="mob-jump">▲</button>
    <button class="mob-btn" id="mob-right">▶</button>
  </div>

  <div class="vol-row">
    <label>🔊 SFX  <input type="range" id="volSfx"   min="0" max="100" value="40"> <span class="vol-val" id="volSfxVal">40%</span></label>
    <label>🎵 Music <input type="range" id="volMusic" min="0" max="100" value="25"> <span class="vol-val" id="volMusicVal">25%</span></label>
  </div>

  <p class="hint"><span class="kb-hint">← → / WASD · ↑ / Space jump · </span>collect coins · reach the door · watch for moving platforms!</p>
  <p class="credit">by <a href="https://github.com/MrMidnight-dev" target="_blank" rel="noopener noreferrer">MrMidnight</a></p>

<script>
// =========================================================================
// VOLUME
// =========================================================================
let sfxVol = 0.40, musicVol = 0.25;
const volSfxEl = document.getElementById("volSfx");
const volMusicEl = document.getElementById("volMusic");
const volSfxVal = document.getElementById("volSfxVal");
const volMusicVal = document.getElementById("volMusicVal");
volSfxEl.addEventListener("input", () => { sfxVol = volSfxEl.value/100; volSfxVal.textContent = volSfxEl.value+"%"; });
volMusicEl.addEventListener("input", () => {
  musicVol = volMusicEl.value/100; volMusicVal.textContent = volMusicEl.value+"%";
  if (musicGain) musicGain.gain.setTargetAtTime(musicVol*0.18, getAC().currentTime, 0.05);
});

// =========================================================================
// AUDIO
// =========================================================================
let ac = null, musicGain = null, musicNodes = [];
function getAC() {
  if (!ac) try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  return ac;
}
function playTone(freq, type, dur, vol) {
  const a = getAC(); if (!a || sfxVol===0) return;
  const g = a.createGain(), o = a.createOscillator();
  o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
  g.gain.setValueAtTime(0, a.currentTime);
  g.gain.linearRampToValueAtTime(vol*sfxVol, a.currentTime+0.008);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+dur+0.01);
}
function sfxJump()    { playTone(300,'sine',0.10,0.28); playTone(460,'sine',0.07,0.18); }
function sfxDeath()   { playTone(200,'sine',0.22,0.30); playTone(130,'sine',0.30,0.22); }
function sfxCoin()    { const a=getAC(); if(!a||sfxVol===0) return; [600,800,1000].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.10,0.18),i*50)); }
function sfxWin()     { const a=getAC(); if(!a||sfxVol===0) return; [440,554,659,880].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.18,0.22),i*100)); }
function sfxGameOver(){ const a=getAC(); if(!a||sfxVol===0) return; [330,247,196,147].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.28,0.22),i*160)); }

// ── Per-biome music tracks ────────────────────────────────────────────────
// Each track is defined as { notes[], step, type, amp }
// notes = Hz values, step = seconds per note, type = oscillator type
const BIOME_TRACKS = {
  space: {
    // Floating arpeggios — sparse, ethereal
    notes: [130.8, 164.8, 196.0, 246.9, 261.6, 196.0, 164.8, 130.8],
    step: 0.38, type: "sine", amp: 0.18,
  },
  forest: {
    // Bouncy major pentatonic — bright, nature-like
    notes: [261.6, 329.6, 392.0, 523.2, 392.0, 329.6, 261.6, 220.0,
            261.6, 392.0, 523.2, 659.2, 523.2, 392.0, 329.6, 261.6],
    step: 0.28, type: "sine", amp: 0.16,
  },
  dungeon: {
    // Ominous low pulse — minor, tense
    notes: [98.0, 110.0, 123.5, 110.0, 98.0, 92.5, 98.0, 110.0,
            123.5, 130.8, 123.5, 110.0, 98.0, 87.3, 92.5, 98.0],
    step: 0.45, type: "triangle", amp: 0.22,
  },
  volcano: {
    // Driving rhythmic pattern — intense, percussive feel
    notes: [146.8, 164.8, 146.8, 110.0, 130.8, 146.8, 164.8, 196.0,
            146.8, 130.8, 110.0, 123.5, 146.8, 164.8, 130.8, 110.0],
    step: 0.22, type: "sawtooth", amp: 0.10,
  },
};

let currentTrackName = "";

function startMusic(biomeName) {
  const a = getAC(); if (!a) return;
  const trackName = biomeName || "space";
  if (trackName === currentTrackName && musicGain) return; // already playing
  stopMusic();
  currentTrackName = trackName;
  musicGain = a.createGain();
  musicGain.gain.setValueAtTime(musicVol * 0.18, a.currentTime);
  musicGain.connect(a.destination);

  const track = BIOME_TRACKS[trackName] || BIOME_TRACKS.space;
  const { notes, step, type, amp } = track;
  let t = a.currentTime + 0.1;

  function scheduleLoop() {
    notes.forEach((freq, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t + i*step);
      g.gain.linearRampToValueAtTime(amp, t + i*step + 0.012);
      g.gain.exponentialRampToValueAtTime(0.001, t + i*step + step*0.85);
      o.connect(g); g.connect(musicGain);
      o.start(t + i*step); o.stop(t + i*step + step);
      musicNodes.push(o);
    });
    t += notes.length * step;
  }

  for (let b = 0; b < 3; b++) scheduleLoop();
  const loopMs = notes.length * step * 1000 * 0.85;
  const id = setInterval(() => {
    if (!ac || ac.state === "closed") { clearInterval(id); return; }
    scheduleLoop();
  }, loopMs);
  musicNodes.push({ stop: () => clearInterval(id) });
}
function stopMusic() {
  musicNodes.forEach(n => { try { n.stop && n.stop(); } catch(e){} });
  musicNodes = []; currentTrackName = "";
}

// =========================================================================
// BIOMES  — each defines colours, bg style, platform tints, spike shape
// =========================================================================
const BIOMES = {
  space: {
    name: "Space",
    bg: "#0a0c12", bgStars: true, bgGrid: true,
    pitColor: "rgba(0,0,0,0.6)",
    platform: ["#3b82f6","#6366f1","#8b5cf6","#06b6d4","#0ea5e9"],
    spike: "#818cf8", spikeGlow: "rgba(129,140,248,0.6)",
    accent: "#38bdf8",
  },
  forest: {
    name: "Forest",
    bg: "#0b1a0d", bgStars: false, bgGrid: false,
    pitColor: "rgba(5,15,5,0.7)",
    platform: ["#16a34a","#15803d","#166534","#4ade80","#22c55e"],
    spike: "#ef4444", spikeGlow: "rgba(239,68,68,0.5)",
    accent: "#86efac",
  },
  dungeon: {
    name: "Dungeon",
    bg: "#100a0a", bgStars: false, bgGrid: true,
    pitColor: "rgba(0,0,0,0.8)",
    platform: ["#78716c","#57534e","#a8a29e","#44403c","#292524"],
    spike: "#dc2626", spikeGlow: "rgba(220,38,38,0.6)",
    accent: "#f97316",
  },
  volcano: {
    name: "Volcano",
    bg: "#150800", bgStars: false, bgGrid: false,
    pitColor: "rgba(180,30,0,0.45)",
    platform: ["#b45309","#92400e","#c2410c","#7c2d12","#f97316"],
    spike: "#fbbf24", spikeGlow: "rgba(251,191,36,0.7)",
    accent: "#fb923c",
  },
};
const BIOME_ORDER = ["space","forest","dungeon","volcano"];

// =========================================================================
// CONFIG
// =========================================================================
const CFG = {
  VW:1100, H:540,        // viewport (visible) size
  W:2640,                 // world width — ~2.4x viewport, scrolls with camera
  gravUp:0.2, gravFall:0.26,
  moveSpeed:2.4, moveAccel:0.22,
  groundFric:0.86, airFric:0.97,
  jumpForce:-6.1, jumpCutVy:-5.1, maxFall:4.5,
  maxJumpHold:14, jumpHoldThrust:0.07, // variable jump height: hold for higher, tap for short hop
  pSize:28, pitY:528,
  platMinW:60, platMaxW:110, platH:16,
  maxJumpX:98, maxJumpUp:65, maxDrop:92,
  minPlats:12, maxPlats:18,   // narrower platforms + bigger gaps fill the world
  groundY:470,
  maxLives:3, coinValue:10,
};

// =========================================================================
// DIFFICULTY SCALING  — smoothly ramps from level 1 onward
// =========================================================================
function difficulty(lvl) {
  const t = Math.min((lvl-1)/14, 1); // 0..1 over 15 levels
  // Extra easing for the very first levels — spikes/movers were appearing
  // too aggressively right out of the gate, before the player has learned
  // the controls. earlyEase fades out by level 6.
  const earlyEase = lvl <= 6 ? (6-lvl)/5 : 0; // 1 at lvl1 → 0 at lvl6
  return {
    spikeChance:   Math.max(0, 0.20 + t*0.45 - earlyEase*0.18),  // gentler start
    extraSpikes:   Math.floor(t*2),         // 0 → 2 extra spikes per platform
    gapBonus:      Math.floor(t*18),        // adds to maxJumpX gap
    movingChance:  (t > 0.15 ? 0.18+t*0.3 : 0) * (1 - earlyEase), // no movers until lvl 6+
    movingSpeed:   0.9 + t*2.2,            // px/frame
    coinChance:    0.40 - t*0.12,           // slightly fewer coins at high lvl
    extraPlats:    Math.min(Math.floor(t*3), 3), // up to 3 extra platforms
  };
}

// =========================================================================
// STATE
// =========================================================================
const canvas      = document.getElementById("game");
const ctx         = canvas.getContext("2d");

// ── DPR-aware backing store ───────────────────────────────────────────────
// The canvas element's logical size stays 1100x540 (all game-coordinate math
// below assumes this). On high-DPI or CSS-downscaled displays (mobile), the
// actual pixel buffer is scaled up by devicePixelRatio and the context is
// scaled to match — this keeps sub-pixel player movement/animation smooth
// instead of snapping to large "display pixels" when the canvas is shrunk
// via CSS (max-width:100%).
(function setupCanvasResolution() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width  = CFG.VW * dpr;
  canvas.height = CFG.H  * dpr;
  canvas.style.width  = CFG.VW + "px";
  canvas.style.height = CFG.H  + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
})();

// =========================================================================
// PARTICLES
// =========================================================================
function spawnParticles(x, y, color, count, speed) {
  for (let i=0;i<count;i++) {
    const angle=(Math.PI*2*i/count)+Math.random()*0.5;
    const s=speed*(0.6+Math.random()*0.8);
    particles.push({x,y,vx:Math.cos(angle)*s,vy:Math.sin(angle)*s-1.5,
      life:1,decay:0.045+Math.random()*0.03,r:3+Math.random()*3,color});
  }
}
function updateParticles() {
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=p.decay;return p.life>0;});
}
function drawParticles() {
  for (const p of particles){ctx.globalAlpha=p.life*0.9;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
}

// =========================================================================
// LEVEL GENERATION — biomes + difficulty + new structures
// =========================================================================
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function randFloat(min,max){return min+Math.random()*(max-min);}

function getBiome(lvl) {
  const idx = Math.floor((lvl-1)/10) % BIOME_ORDER.length;
  return BIOMES[BIOME_ORDER[idx]];
}

// ── Physics-based jump reach calculator ──────────────────────────────────
// Given a starting platform, returns the box of reachable positions for
// the next platform's top-left corner. Keeps generation honest.
function jumpReach(diff) {
  // Horizontal: player can travel ~maxJumpX + difficulty bonus px during a jump
  const maxH = CFG.maxJumpX + diff.gapBonus;
  // Vertical up: max height gain during jump
  const maxU = CFG.maxJumpUp;
  // Vertical down: max drop (player survives landing)
  const maxD = CFG.maxDrop;
  return { maxH, maxU, maxD };
}

// ── Overlap check (with breathing room) ──────────────────────────────────
function platsOverlap(a, b) {
  const mx = 6;   // horizontal margin
  const my = 40;  // vertical clear zone — no platform within 40px above/below
  return a.x < b.x+b.w+mx && a.x+a.w+mx > b.x &&
         a.y < b.y+b.h+my && a.y+a.h+my > b.y;
}

// ── Spike helpers ─────────────────────────────────────────────────────────
function maxSpikesForWidth(w) { return Math.max(0, Math.floor((w-32)/22)); }

// ── Door clearance check ──────────────────────────────────────────────────
// Returns true if rect r is too close to the door zone
function nearDoor(r, door) {
  const pad = 20;
  return r.x < door.x+door.w+pad && r.x+r.w > door.x-pad &&
         r.y < door.y+door.h+pad && r.y+r.h > door.y-pad;
}

// ── Layout directions ─────────────────────────────────────────────────────
// "lr"  = left→right (classic)
// "rl"  = right→left
// "bu"  = bottom→up (start bottom-right, climb to top-left)
// "mix" = left→right but with aggressive vertical variation
const LAYOUTS = ["lr","rl","lr","mix","lr","rl"]; // "bu" removed — caused unreachable layouts

function pickLayout(lvl) {
  // First 2 levels always left-right so player learns the game
  if (lvl <= 3) return "lr"; // first 3 levels always left-right
  return LAYOUTS[randInt(0, LAYOUTS.length-1)];
}

// ── Main generation ───────────────────────────────────────────────────────
function tryGenerateLevel(lvl) {
  const diff  = difficulty(lvl);
  const biome = getBiome(lvl);
  const reach = jumpReach(diff);
  const layout = pickLayout(lvl);
  const platforms=[], spikes=[], coins=[], fallers=[];

  const count = randInt(CFG.minPlats, CFG.maxPlats + diff.extraPlats);

  // ── Determine start position by layout ──────────────────────────────
  let curX, curY, dirX, dirY;
  const margin = 50;

  if (layout === "lr") {
    curX = margin; curY = CFG.groundY - randInt(60,110);
    dirX =  1; dirY = 0;
  } else if (layout === "rl") {
    curX = CFG.W - margin - randInt(90,130); curY = CFG.groundY - randInt(60,110);
    dirX = -1; dirY = 0;
  } else if (layout === "bu") {
    // Start bottom-right, door will be top-left area
    curX = CFG.W - margin - randInt(90,130);
    curY = CFG.groundY - randInt(40,70);   // near bottom
    dirX = -1; dirY = -1;  // move left and generally up
  } else { // mix
    curX = margin; curY = CFG.groundY - randInt(60,110);
    dirX = 1; dirY = 0;
  }

  const startW = randInt(95,140);
  platforms.push({x:curX, y:curY, w:startW, h:CFG.platH, color:0, biome});

  for (let i=1; i<count; i++) {
    const prev   = platforms[platforms.length-1];
    const isLast = i === count-1;
    let newX, newY, newW;
    let placed = false;

    for (let attempt=0; attempt<14; attempt++) {
      newW = randInt(CFG.platMinW, CFG.platMaxW);

      let gapX, dy;

      // Hard limits derived from player physics:
      // Horizontal: player can jump at most ~reach.maxH px during a full jump arc
      // Vertical up: max height gain is reach.maxU px
      // Vertical down: max safe drop is reach.maxD px
      const safeGapMax = reach.maxH - 10;   // leave 10px safety margin
      const safeUp     = reach.maxU - 8;
      const safeDown   = reach.maxD - 8;

      if (layout === "bu") {
        gapX = randInt(45, Math.min(safeGapMax, 85));
        dy   = isLast ? randInt(-safeUp, -30) : randInt(-safeUp, -18);
        const side = (i%2===0 ? 1 : -1) * (dirX < 0 ? -1 : 1);
        newX = prev.x + side * (prev.w + Math.abs(gapX));
      } else if (layout === "mix") {
        gapX = randInt(48, Math.min(safeGapMax, 90));
        dy   = isLast ? randInt(-safeUp, -28)
             : randInt(-safeUp, safeDown);
        newX = prev.x + dirX * (prev.w + gapX);
      } else {
        gapX = isLast ? randInt(50, Math.min(safeGapMax, 88))
                      : randInt(46, Math.min(safeGapMax, 88));
        dy   = isLast ? randInt(-safeUp, -22)
                      : randInt(-safeUp, safeDown);
        newX = prev.x + dirX * (prev.w + gapX);
      }

      newY = Math.max(78, Math.min(CFG.groundY - 68, prev.y + dy));
      newX = Math.max(12, Math.min(CFG.W - newW - 12, newX));

      const candidate = {x:newX, y:newY, w:newW, h:CFG.platH};

      // Reachability check: the actual gap after clamping must be jumpable.
      // dx = horizontal distance between platform edges (can be 0 if overlapping in X)
      // dy = vertical difference (positive = next is lower)
      const dx = Math.max(0, newX > prev.x ? newX - (prev.x+prev.w) : prev.x - (newX+newW));
      const actualDy = newY - prev.y; // positive = lower, negative = higher

      const reachable = dx <= reach.maxH && actualDy <= reach.maxD && actualDy >= -reach.maxU;
      if (!reachable) continue;

      // No overlap with existing platforms
      if (!platforms.every(p => !platsOverlap(candidate, p))) continue;

      placed = true; break;
    }

    if (!placed) continue;

    const platObj = {x:newX, y:newY, w:newW, h:CFG.platH, color:i%biome.platform.length, biome};

    // Moving platforms: only mid-level, only if enough horizontal gap from neighbours
    if (!isLast && i>1 && Math.random() < diff.movingChance) {
      const axis = Math.random() < 0.6 ? "h" : "v";
      // Safe range: never more than 40% of the gap to the previous platform
      const gap = Math.abs(newX - (prev.x+prev.w));
      const maxRange = axis==="h" ? Math.min(gap*0.38, 50) : 34;
      if (maxRange >= 14) {
        platObj.moving = {
          axis, range: randInt(14, Math.floor(maxRange)),
          speed: diff.movingSpeed * (0.55+Math.random()*0.7),
          origin: axis==="h" ? newX : newY,
          t: Math.random()*Math.PI*2,
        };
      }
    }

    platforms.push(platObj);

    // Spikes: not on moving platforms, not on last platform
    // Placement styles: left-edge, right-edge, both-edges, center, spread
    if (!isLast && i>1 && !platObj.moving && newW >= 100 && Math.random() < diff.spikeChance) {
      const maxFit = maxSpikesForWidth(newW);
      if (maxFit >= 1) {
        // Styles: 0=left cluster  1=right cluster  2=both edges  3=spread
        const style = randInt(0, 3);
        const edgeOff = 6; // px from platform edge
        const sc = randInt(1, Math.min(1+diff.extraSpikes, maxFit));
        if (style === 0) {
          // Left side cluster
          for (let s=0; s<sc; s++) spikes.push({x:newX+edgeOff+s*20, y:newY-14, w:14, h:14});
        } else if (style === 1) {
          // Right side cluster
          for (let s=0; s<sc; s++) spikes.push({x:newX+newW-edgeOff-14-s*20, y:newY-14, w:14, h:14});
        } else if (style === 2) {
          // Both edges — 1 spike each side, middle stays clear
          spikes.push({x:newX+edgeOff,         y:newY-14, w:14, h:14});
          spikes.push({x:newX+newW-edgeOff-14, y:newY-14, w:14, h:14});
        } else {
          // Spread: random positions with min spacing, never dead-center
          const placed2 = [];
          const mid = newX + newW/2;
          for (let s=0; s<sc*4 && placed2.length<sc; s++) {
            const sx = newX + edgeOff + randInt(0, newW - 14 - edgeOff*2);
            const notCenter = Math.abs(sx + 7 - mid) > 18;
            if (notCenter && placed2.every(px => Math.abs(px-sx) > 18)) placed2.push(sx);
          }
          for (const sx of placed2) spikes.push({x:sx, y:newY-14, w:14, h:14});
        }
      }
    }

    // Coins: never where spikes are, never on moving platforms
    const hasSpikeHere = spikes.some(s => s.x>=newX && s.x<newX+newW);
    if (!isLast && !platObj.moving && !hasSpikeHere && Math.random() < diff.coinChance) {
      const cc = randInt(1,2);
      const sp = newW/(cc+1);
      for (let c=0;c<cc;c++) coins.push({
        x:newX+sp*(c+1)-7, y:newY-28, w:14, h:14,
        collected:false, bobOffset:Math.random()*Math.PI*2,
      });
    }
  }

  if (platforms.length < CFG.minPlats) return null;

  const first = platforms[0];
  const spawnX = layout === "rl" || layout === "bu"
    ? first.x + first.w - CFG.pSize - 10
    : first.x + 14;
  const spawn = {x:spawnX, y:first.y - CFG.pSize};

  const wallOnLeft = (layout === "lr" || layout === "mix");
  const spawnWall = wallOnLeft
    ? {x: first.x - 24, y: first.y - 120, w: 24, h: 120}
    : {x: first.x + first.w, y: first.y - 120, w: 24, h: 120};

  return finalizeLevel(platforms, spikes, coins, biome, layout, diff, reach, spawn, spawnWall);
}

// ════════════════════════════════════════════════════════════════════════
// SHARED TAIL — door placement, cleanup, wind zones, lever+bridge puzzle,
// reachability checks. Used by both the normal chain generator and the
// floor-level generator.
// ════════════════════════════════════════════════════════════════════════
function finalizeLevel(platforms, spikes, coins, biome, layout, diff, reach, spawn, spawnWall) {
  // ── Door on last platform, well-centered, nothing near it ───────────
  const last = platforms[platforms.length-1];
  const door = {x:last.x+last.w/2-18, y:last.y-44, w:36, h:44};

  // Remove platforms stacked too close to the door column — both above
  // (would visually/physically block the door from the top) and below
  // (keep first and last platform always)
  const doorPlat = last;
  let cleanPlatforms = platforms.filter((p, idx) => {
    if (idx === 0 || idx === platforms.length-1) return true; // always keep start+end
    const inDoorColumn = p.x < doorPlat.x+doorPlat.w+10 && p.x+p.w > doorPlat.x-10;
    if (!inDoorColumn) return true;
    const tooClose = p.y > doorPlat.y - 150 && p.y < doorPlat.y + 130;
    return !tooClose;
  });

  // Remove any spikes / coins that are inside or near the door, or whose
  // underlying platform was removed by the door-column cleanup above
  function hasSupportingPlatform(obj, surfaceOffset, platList) {
    const platY = obj.y + surfaceOffset;
    return platList.some(p =>
      p.x <= obj.x + obj.w*0.5 && p.x+p.w >= obj.x + obj.w*0.5 &&
      Math.abs(p.y - platY) < 4
    );
  }
  let filteredSpikes = spikes.filter(s => !nearDoor(s, door) && hasSupportingPlatform(s, 14, cleanPlatforms));
  let filteredCoins  = coins.filter(c => !nearDoor(c, door) && hasSupportingPlatform(c, 28, cleanPlatforms));

  // ════════════════════════════════════════════════════════════════════
  // WIND — single level-wide zone covering the entire world/height.
  // Leaves drift across the whole screen; wind pushes player in air.
  // ════════════════════════════════════════════════════════════════════
  const windZones = [];
  if (Math.random() < 0.55) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    windZones.push({
      x: 0, y: 0, w: CFG.W, h: CFG.H,
      dir, strength: 0.032 + Math.random()*0.022,
    });
  }

  // ════════════════════════════════════════════════════════════════════
  // LEVER → BRIDGE PUZZLE
  // ════════════════════════════════════════════════════════════════════
  // Push the door platform further away from "approach" so the gap exceeds
  // the player's jump range — the bridge becomes mandatory, not optional.
  // A row of bridge segments fills that gap but starts INACTIVE (invisible/
  // non-solid). A lever sits on a short side-branch off the main path.
  // Activating it animates the bridge segments into place and makes them solid.

  const approach = cleanPlatforms.length >= 2 ? cleanPlatforms[cleanPlatforms.length-2] : null;
  let bridge = [], lever = null;

  if (approach && approach !== doorPlat) {
    const approachRight = approach.x + approach.w;
    const approachLeft  = approach.x;
    let doorPlatLeft  = doorPlat.x;
    let doorPlatRight = doorPlat.x + doorPlat.w;

    const goingRight = doorPlatLeft >= approachRight; // door is to the right of approach
    const requiredGap = reach.maxH + randInt(30, 55); // must exceed jump range

    // Other platforms that could collide with doorPlat if shifted — exclude
    // approach (the bridge fills that gap) and doorPlat itself.
    const others = cleanPlatforms.filter(p => p !== doorPlat && p !== approach);

    if (goingRight) {
      const currentGap = doorPlatLeft - approachRight;
      if (currentGap < requiredGap) {
        let shift = requiredGap - currentGap;
        // Clamp against world bound
        const maxShiftWorld = (CFG.W - 12) - doorPlatRight;
        shift = Math.min(shift, Math.max(0, maxShiftWorld));
        // Clamp against any other platform doorPlat would overlap when moved right
        for (const p of others) {
          // Only platforms vertically close enough to matter (use platsOverlap's my=40 band)
          if (Math.abs(p.y - doorPlat.y) >= 40 + doorPlat.h) continue;
          if (p.x + p.w + 6 <= doorPlatLeft) continue; // already to the left, can't collide on rightward move
          if (p.x >= doorPlatRight + shift + 6) continue; // far enough right, won't collide
          // doorPlat moving right could hit p's left edge
          const maxShiftToP = (p.x - 6) - doorPlatRight;
          if (maxShiftToP >= 0) shift = Math.min(shift, maxShiftToP);
          else shift = 0; // already overlapping in x — don't move at all
        }
        doorPlat.x += shift; door.x += shift;
        doorPlatLeft += shift; doorPlatRight += shift;
      }
    } else {
      const currentGap = approachLeft - doorPlatRight;
      if (currentGap < requiredGap) {
        let shift = requiredGap - currentGap;
        const maxShiftWorld = doorPlatLeft - 12;
        shift = Math.min(shift, Math.max(0, maxShiftWorld));
        for (const p of others) {
          if (Math.abs(p.y - doorPlat.y) >= 40 + doorPlat.h) continue;
          if (p.x >= doorPlatRight + 6) continue; // already to the right, can't collide on leftward move
          if (p.x + p.w <= doorPlatLeft - shift - 6) continue;
          const maxShiftToP = doorPlatLeft - (p.x + p.w + 6);
          if (maxShiftToP >= 0) shift = Math.min(shift, maxShiftToP);
          else shift = 0;
        }
        doorPlat.x -= shift; door.x -= shift;
        doorPlatLeft -= shift; doorPlatRight -= shift;
      }
    }

    // Recompute final gap after shifting
    const gapFromRight = doorPlatLeft - approachRight;
    const gapFromLeft  = approachLeft - doorPlatRight;
    const finalGoingRight = gapFromRight >= gapFromLeft;
    const actualGap = Math.max(gapFromRight, gapFromLeft);

    // Only build a bridge if there's an actual gap to fill (the shift may
    // have been clamped to 0 due to overlap with other platforms — in that
    // case the door is already reachable directly, no bridge needed).
    if (actualGap > 20) {
      const gapWidth = actualGap;
      const segW = 50; // each bridge segment width
      const segCount = Math.max(1, Math.min(5, Math.ceil(gapWidth / segW)));
      const bridgeY  = (approach.y + doorPlat.y) / 2; // average height, spans the gap

      for (let s=0; s<segCount; s++) {
        const bx = finalGoingRight
          ? approachRight + s*segW
          : doorPlatRight + s*segW;
        bridge.push({
          x:bx, y:bridgeY, w:Math.min(segW, gapWidth - s*segW + 4), h:CFG.platH,
          color: 1, biome,
          active:false,            // becomes true (solid+visible) when lever pulled
          revealProgress: 0,       // 0..1 animation
          revealDelay: s * 6,      // stagger the reveal animation, frames
        });
      }
    }

    // ── Lever placement: genuine side-branch off a mid-path platform ────
    // Only relevant if a bridge actually exists for it to activate.
    // Pick a mid platform (not first/last/approach) to branch from.
    const branchCandidates = bridge.length === 0 ? [] : cleanPlatforms
      .map((p, idx) => ({p, idx}))
      .filter(({p, idx}) => idx > 0 && idx < cleanPlatforms.length-2 && !nearDoor(p, door));

    // Shuffle candidates so we try different branch points if the first fails
    for (let ci = branchCandidates.length-1; ci > 0; ci--) {
      const j = randInt(0, ci);
      [branchCandidates[ci], branchCandidates[j]] = [branchCandidates[j], branchCandidates[ci]];
    }

    for (const {p: branchFrom} of branchCandidates) {
      // Try both directions, prefer one that points AWAY from the main chain's
      // general travel direction (so it's a genuine detour, not "next platform")
      for (const branchDir of [1, -1, Math.random()<0.5?1:-1]) {
        const bW = randInt(55, 75);
        // Bigger gap and steeper rise than a normal chain step, so it reads
        // as "off the path" rather than "the next platform"
        const bGapX = randInt(Math.ceil(reach.maxH*0.55), Math.floor(reach.maxH) - 8);
        const bDy   = -randInt(Math.ceil(reach.maxU*0.6), Math.floor(reach.maxU) - 6);
        let bX = branchDir > 0 ? branchFrom.x + branchFrom.w + bGapX : branchFrom.x - bGapX - bW;
        let bY = Math.max(40, branchFrom.y + bDy);
        bX = Math.max(8, Math.min(CFG.W - bW - 8, bX));

        const leverPlat = {x:bX, y:bY, w:bW, h:CFG.platH, color:(branchFrom.color+2)%biome.platform.length, biome};

        const dx = Math.max(0, bX > branchFrom.x ? bX - (branchFrom.x+branchFrom.w) : branchFrom.x - (bX+bW));
        const dyAbs = Math.abs(bY - branchFrom.y);
        const inRange  = dx <= reach.maxH && dyAbs <= reach.maxU;
        const noOverlap = cleanPlatforms.every(p => !platsOverlap(leverPlat, p)) &&
                           bridge.every(p => !platsOverlap(leverPlat, p));

        // Isolation: the lever platform must NOT be reachable from any main-chain
        // platform other than branchFrom — otherwise the player could skip the
        // "detour" entirely by jumping straight from a neighbouring platform.
        const isolated = cleanPlatforms.every(p =>
          p === branchFrom || (!canReach(p, leverPlat, diff) && !canReach(leverPlat, p, diff))
        );

        if (inRange && noOverlap && isolated) {
          cleanPlatforms.push(leverPlat);
          lever = {
            x: bX + bW/2 - 11, y: bY - 24,
            w: 22, h: 24, pulled: false,
          };
          break;
        }
      }
      if (lever) break;
    }
  }

  // If we couldn't place a lever (no room), fall back to making the bridge
  // already active — level is still completable, just without the puzzle.
  if (!lever) {
    bridge.forEach(b => { b.active = true; b.revealProgress = 1; });
  }

  // ── Reachability checks ──────────────────────────────────────────────
  // 1. With the bridge present, spawn → door platform must be reachable
  //    (validates the level is solvable once the lever is pulled)
  const allPlatformsWithBridge = cleanPlatforms.concat(bridge);
  if (!isReachableTo(allPlatformsWithBridge, doorPlat, diff)) return null;

  // 2. If a lever exists, the lever's platform (last pushed onto cleanPlatforms)
  //    must be reachable WITHOUT the bridge — i.e. it's a genuine side-branch
  if (lever) {
    const leverPlat = cleanPlatforms[cleanPlatforms.length-1];
    if (!isReachableTo(cleanPlatforms, leverPlat, diff)) return null;
  }

  const doorWall = null; // door is now purely decorative when locked — no physical block

  return {platforms:cleanPlatforms, bridge, lever, spikes:filteredSpikes, coins:filteredCoins,
          fallers:[], spawn, spawnWall, door, doorWall, key:null, windZones, biome, layout};
}

// ── Reachability check ───────────────────────────────────────────────────
// Can the player jump from platform A to platform B?
// Uses conservative physics estimates.
function canReach(a, b, diff) {
  const reach = jumpReach(diff);
  // Horizontal distance between nearest edges
  const horizGap = Math.max(0, b.x - (a.x+a.w), a.x - (b.x+b.w));
  // Vertical: positive = B is above A
  const vertDiff = a.y - b.y;  // positive means B is higher than A
  if (horizGap > reach.maxH) return false;
  if (vertDiff >  reach.maxU) return false; // B too high to jump to
  if (vertDiff < -reach.maxD) return false; // B too far below (deadly fall)
  return true;
}

// BFS: can player reach door platform from spawn platform?
function isReachable(platforms, diff) {
  if (platforms.length < 2) return false;
  const visited = new Set([0]);
  const queue   = [0];
  const goal    = platforms.length - 1;
  while (queue.length) {
    const cur = queue.shift();
    if (cur === goal) return true;
    for (let j=0; j<platforms.length; j++) {
      if (visited.has(j)) continue;
      if (canReach(platforms[cur], platforms[j], diff) ||
          canReach(platforms[j], platforms[cur], diff)) {
        visited.add(j);
        queue.push(j);
      }
    }
  }
  return visited.has(goal);
}

// BFS from platforms[0] to a specific target platform (by reference)
function isReachableTo(platforms, targetPlat, diff) {
  if (platforms.length < 2) return false;
  const goalIdx = platforms.indexOf(targetPlat);
  if (goalIdx === -1) return false;
  const visited = new Set([0]);
  const queue   = [0];
  while (queue.length) {
    const cur = queue.shift();
    if (cur === goalIdx) return true;
    for (let j=0; j<platforms.length; j++) {
      if (visited.has(j)) continue;
      if (canReach(platforms[cur], platforms[j], diff) ||
          canReach(platforms[j], platforms[cur], diff)) {
        visited.add(j);
        queue.push(j);
      }
    }
  }
  return visited.has(goalIdx);
}

// ════════════════════════════════════════════════════════════════════════
// FLOOR LEVEL — a solid platform spans the entire world at ground level.
// The player can never fall off the bottom. Above the floor, a chain of
// platforms climbs toward a door near the top of the screen. The lever
// for the bridge puzzle sits on an isolated ledge reached by a side-jump
// off the main ascending path — not directly on the route up.
// ════════════════════════════════════════════════════════════════════════
function tryGenerateFloorLevel(lvl) {
  const diff  = difficulty(lvl);
  const biome = getBiome(lvl);
  const reach = jumpReach(diff);
  const spikes=[], coins=[];

  // The floor: one giant platform spanning the whole world width.
  // Its top surface sits at groundY, same as normal levels' lowest point.
  const floor = {x:0, y:CFG.groundY, w:CFG.W, h:CFG.H-CFG.groundY+40, color:0, biome};

  const platforms = [floor];

  // Ascending chain — climbs from the floor toward a door near the top,
  // while making steady NET horizontal progress across the wide world
  // (previously a zig-zag with cancelling +1/-1 directions caused every
  // platform to pile up near the starting X and hit the height ceiling
  // after 2-3 steps). Overall travel direction is randomised left/right.
  const count = randInt(CFG.minPlats, CFG.maxPlats);
  const travelRight = Math.random() < 0.5;
  let curX = travelRight ? 160 : CFG.W - 160;
  let curY = CFG.groundY - randInt(45, 68); // within jump reach of the floor

  // Total height to climb and total width to cross, spread evenly across
  // (count-1) steps so the chain doesn't hit the ceiling early.
  const totalClimb = (CFG.groundY - 90) - curY; // distance from start to near-top
  const climbPerStep = totalClimb / Math.max(1, count-1);

  // Virtual anchor for the first ascending platform — a zero-width point at
  // (curX, curY). Using `floor` (which spans the whole world) as `prev` would
  // produce nonsensical offsets for the first step.
  let prevRef = {x: curX, y: curY, w: 0};

  for (let i=1; i<count; i++) {
    const prev = prevRef;
    const isLast = i === count-1;
    let newX, newY, newW, placed=false;

    const safeGapMax = reach.maxH - 10;
    const safeUp     = reach.maxU - 8;

    for (let attempt=0; attempt<14; attempt++) {
      newW = randInt(CFG.platMinW, CFG.platMaxW);

      // Net horizontal progress in the travel direction, with a small
      // zig-zag wobble (occasionally step back slightly) for visual variety
      const dir = travelRight ? 1 : -1;
      const wobble = (Math.random() < 0.25) ? -1 : 1; // 25% chance of a small backstep
      const gapX = randInt(40, Math.min(safeGapMax, 90));

      // Climb amount: spread the total climb evenly, with some per-step variance,
      // clamped so we never exceed what's reachable in one jump.
      const dyTarget = Math.min(safeUp, Math.max(12, climbPerStep + randInt(-15, 15)));
      const dy = isLast ? -Math.min(safeUp, Math.max(35, dyTarget)) : -dyTarget;

      newX = prev.x + dir * wobble * (prev.w/2 + gapX);
      newY = Math.max(50, prev.y + dy); // climbing only — never goes below prev

      newX = Math.max(8, Math.min(CFG.W - newW - 8, newX));

      const candidate = {x:newX, y:newY, w:newW, h:CFG.platH};

      const dx = Math.max(0, newX > prev.x ? newX - (prev.x+prev.w) : prev.x - (newX+newW));
      const actualDy = newY - prev.y;
      const reachable = dx <= reach.maxH && actualDy <= 0 && actualDy >= -reach.maxU;
      if (!reachable) continue;

      // No overlap with existing platforms (floor excluded — everything sits above it)
      if (!platforms.slice(1).every(p => !platsOverlap(candidate, p))) continue;
      // Must stay above the floor
      if (newY > CFG.groundY - 60) continue;

      placed = true; break;
    }

    if (!placed) continue;

    prevRef = {x:newX, y:newY, w:newW}; // advance the chain anchor

    const platObj = {x:newX, y:newY, w:newW, h:CFG.platH, color:i%biome.platform.length, biome};

    // Occasional spikes on wide-enough mid platforms
    if (!isLast && i>1 && newW >= 100 && Math.random() < diff.spikeChance*0.7) {
      const maxFit = maxSpikesForWidth(newW);
      if (maxFit >= 1) {
        spikes.push({x:newX+10, y:newY-14, w:14, h:14});
      }
    }

    // Coins along the climb
    if (!isLast && Math.random() < diff.coinChance) {
      coins.push({x:newX+newW/2-7, y:newY-28, w:14, h:14, collected:false, bobOffset:Math.random()*Math.PI*2});
    }

    platforms.push(platObj);
  }

  if (platforms.length < 5) return null; // need floor + at least a few climbing platforms

  // ── Spawn on the floor, on the side where the ascending chain begins ──
  const spawn = {x: travelRight ? 40 : CFG.W - 40 - CFG.pSize, y: floor.y - CFG.pSize};
  // No spawn wall needed — floor spans the whole world, nothing to fall off

  return finalizeLevel(platforms, spikes, coins, biome, "lr", diff, reach, spawn, null);
}

function generateLevel(lvl) {
  const diff = difficulty(lvl);
  // First 5 levels are always floor levels — gentle introduction with a
  // safety-net floor under the whole level, no falling, easier pacing.
  // After that, floor levels appear every 3rd level (was every 5th) since
  // they read as more approachable / puzzle-focused than the jump chains.
  const useFloor = lvl <= 5 || (lvl-1) % 3 === 2;

  if (useFloor) {
    for (let a=0; a<120; a++) {
      const c = tryGenerateFloorLevel(lvl);
      if (c) return c; // finalizeLevel already validated reachability internally
    }
    // fall through to normal generation if floor generation somehow fails repeatedly
  }

  for (let a=0; a<120; a++) {
    const c = tryGenerateLevel(lvl);
    if (!c || c.platforms.length < CFG.minPlats) continue;
    if (isReachable(c.platforms, diff)) return c;
  }
  // Guaranteed fallback — evenly spaced, always reachable, spans the world
  const biome = getBiome(lvl);
  const platforms=[];
  const stepX = 78; // within jump range
  const n = Math.floor((CFG.W - 100) / stepX);
  for (let i=0;i<n;i++) {
    platforms.push({
      x: 40 + i*stepX,
      y: CFG.groundY - 80 - (i%4)*28,
      w: 110, h: CFG.platH,
      color: i%biome.platform.length, biome
    });
  }
  const last = platforms[n-1];
  const door  = {x:last.x+last.w/2-18, y:last.y-44, w:36, h:44};
  const spawn = {x:platforms[0].x+14, y:platforms[0].y-CFG.pSize};
  const fbWall = {x: platforms[0].x - 24, y: platforms[0].y - 120, w: 24, h: 120};
  return {platforms, bridge:[], lever:null, spikes:[], coins:[], fallers:[], spawn, spawnWall:fbWall, door, doorWall:null, key:null, windZones:[], biome, layout:"lr"};
}

// =========================================================================
// CAMERA
// =========================================================================
function updateCamera() {
  // Target: center player horizontally in viewport
  const targetX = player.x + player.w/2 - CFG.VW/2;
  // Smooth follow
  cameraX += (targetX - cameraX) * 0.12;
  // Clamp to world bounds
  cameraX = Math.max(0, Math.min(CFG.W - CFG.VW, cameraX));
}

// =========================================================================
// MOVING PLATFORMS  update
// =========================================================================
function updateMovingPlatforms(platforms) {
  for (const plat of platforms) {
    if (!plat.moving) continue;
    const m = plat.moving;
    m.t += 0.02;
    if (m.axis === "h") {
      plat.x = m.origin + Math.sin(m.t) * m.range;
      plat.x = Math.max(0, Math.min(CFG.W - plat.w, plat.x));
    } else {
      plat.y = m.origin + Math.sin(m.t) * m.range;
      plat.y = Math.max(40, Math.min(CFG.groundY - 20, plat.y));
    }
  }
}


// =========================================================================
// PLAYER
// =========================================================================
function createPlayer(spawn) {
  return {
    x:spawn.x, y:spawn.y, w:CFG.pSize, h:CFG.pSize,
    vx:0, vy:0, onGround:false, wasOnGround:false,
    facing:1, animT:0, landSquash:0, slideDust:[],
    coyoteTime:0, jumpBuffer:0,
    jumpHoldTime:0,    // frames the jump button has been held during ascent
    jumpCutDone:false, // whether the early-release height cut has been applied for this jump
    prevY:0,           // Y before current frame move (for one-way collision)
    standingOn:null,   // reference to moving platform player is on
  };
}

function updatePlayer(p) {
  // Carry from moving platform
  if (p.standingOn && p.standingOn.moving) {
    const m = p.standingOn.moving;
    if (m.axis==="h") p.x += Math.cos(m.t)*m.range*0.02*Math.abs(m.speed)*0.6;
    else p.y += Math.cos(m.t)*m.range*0.02*Math.abs(m.speed)*0.4;
  }
  p.standingOn = null;

  if (keys.left)  { p.vx-=CFG.moveAccel; p.facing=-1; }
  if (keys.right) { p.vx+=CFG.moveAccel; p.facing= 1; }
  if (!keys.left&&!keys.right) { p.vx*=p.onGround?CFG.groundFric:CFG.airFric; if(Math.abs(p.vx)<0.04)p.vx=0; }

  // Wind zones push the player horizontally while airborne
  if (!p.onGround && level.windZones) {
    for (const wz of level.windZones) {
      if (p.x+p.w > wz.x && p.x < wz.x+wz.w && p.y+p.h > wz.y && p.y < wz.y+wz.h) {
        p.vx += wz.dir * wz.strength;
      }
    }
  }

  const maxSpeed = CFG.moveSpeed + (level.windZones && level.windZones.length ? 1.2 : 0);
  p.vx=Math.max(-maxSpeed,Math.min(maxSpeed,p.vx));

  if (p.onGround) p.coyoteTime=6; else if(p.coyoteTime>0) p.coyoteTime--;
  if (keys.up) p.jumpBuffer=8; else if(p.jumpBuffer>0) p.jumpBuffer--;
  if (p.jumpBuffer>0&&p.coyoteTime>0&&p.vy>=-1) {
    p.vy=CFG.jumpForce; p.coyoteTime=0; p.jumpBuffer=0; p.jumpHoldTime=0; p.jumpCutDone=false; sfxJump();
  }

  // Variable jump height: holding the jump button sustains upward thrust
  // for up to CFG.maxJumpHold frames, letting the player reach extra height.
  // Releasing early applies ONE gentle cut (clamping vy toward jumpCutVy via
  // a ramp, not an instant snap) for a snappy short hop without a velocity jolt.
  if (p.vy < 0) {
    if (keys.up && p.jumpHoldTime < CFG.maxJumpHold) {
      p.jumpHoldTime++;
      p.vy -= CFG.jumpHoldThrust; // extra upward push while held
    } else if (!keys.up && !p.jumpCutDone) {
      // Smoothly ease vy toward jumpCutVy instead of snapping — avoids a
      // visible/felt discontinuity if vy is currently more negative than the cut target
      if (p.vy < CFG.jumpCutVy) p.vy += (CFG.jumpCutVy - p.vy) * 0.35;
      p.jumpCutDone = true; // only ease once per jump, then let gravity take over normally
    }
  } else {
    p.jumpHoldTime = 0;
  }

  p.vy+=p.vy<0?(keys.up?CFG.gravUp:CFG.gravUp*1.15):CFG.gravFall;
  if(p.vy>CFG.maxFall) p.vy=CFG.maxFall;
  p.prevY = p.y;   // remember pre-move Y for one-way collision
  p.x+=p.vx; p.y+=p.vy;
  if(p.x<0){p.x=0;p.vx*=0.35;} if(p.x+p.w>CFG.W){p.x=CFG.W-p.w;p.vx*=0.35;}
}

function updatePlayerMotionFx(p) {
  if(p.landSquash>0) p.landSquash--;
  if(p.onGround&&Math.abs(p.vx)>0.35) p.animT+=0.14+Math.abs(p.vx)*0.04; else p.animT*=0.85;
  const sliding=p.onGround&&!keys.left&&!keys.right&&Math.abs(p.vx)>0.5;
  if(sliding&&Math.random()<0.35) p.slideDust.push({x:p.x+(p.vx>0?2:p.w-2),y:p.y+p.h-3,life:14,drift:-p.vx*0.25});
  p.slideDust=p.slideDust.filter(d=>{d.x+=d.drift;d.life--;return d.life>0;});
}

function playerFellInPit(p){ return p.y+p.h>=CFG.pitY; }

function resetPlayerToSpawn() {
  player.x=level.spawn.x; player.y=level.spawn.y;
  player.vx=0; player.vy=0; player.onGround=false; player.wasOnGround=false;
  player.landSquash=0; player.slideDust=[]; player.animT=0; player.coyoteTime=0; player.jumpBuffer=0;
  player.jumpHoldTime=0; player.jumpCutDone=false;
  player.prevY=player.y; player.standingOn=null;
  cameraX = Math.max(0, Math.min(CFG.W - CFG.VW, player.x + player.w/2 - CFG.VW/2));
}

// =========================================================================
// COLLISIONS
// =========================================================================
function rectsOverlap(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }

function resolveWallCollision(p, wall) {
  if (!wall) return;
  if (!rectsOverlap(p, wall)) return;
  // Push player out horizontally only
  const overlapLeft  = p.x + p.w - wall.x;
  const overlapRight = wall.x + wall.w - p.x;
  if (overlapLeft < overlapRight) { p.x = wall.x - p.w; }
  else                            { p.x = wall.x + wall.w; }
  p.vx = 0;
}

// Solid block on all 4 sides — used for the locked door barrier
function resolveSolidCollision(p, box) {
  if (!box) return;
  if (!rectsOverlap(p, box)) return;
  const oL = p.x+p.w - box.x,  oR = box.x+box.w - p.x;
  const oT = p.y+p.h - box.y,  oB = box.y+box.h - p.y;
  const minX = Math.min(oL, oR), minY = Math.min(oT, oB);
  if (minX < minY) {
    p.x = oL < oR ? box.x - p.w : box.x + box.w;
    p.vx = 0;
  } else {
    if (oT < oB) { p.y = box.y - p.h; if (p.vy>2) p.landSquash=12; p.vy = Math.max(0,p.vy); p.onGround = p.vy===0 || p.onGround; }
    else         { p.y = box.y + box.h; p.vy = Math.min(0,p.vy); }
  }
}

function resolvePlatformCollisions(p, platforms) {
  for (const plat of platforms) {
    if (!rectsOverlap(p,plat)) continue;

    // One-way: only land when player was above the platform top last frame
    // and is now moving downward (or zero). Jumping up passes through.
    const feetWasAbove = p.prevY + p.h <= plat.y + 3; // prevY set in gameLoop before move
    if (p.vy < 0 || !feetWasAbove) continue;

    p.y = plat.y - p.h;
    if (p.vy > 2) p.landSquash = 12;
    p.vy = 0; p.onGround = true; p.standingOn = plat;
  }
}

function checkCoinPickups(p) {
  for (const coin of level.coins) {
    if (!coin.collected&&rectsOverlap(p,coin)) {
      coin.collected=true; score+=CFG.coinValue; totalCoins++;
      spawnParticles(coin.x+7,coin.y+7,currentBiome.accent,8,2.5);
      sfxCoin(); updateHud();
    }
  }
}

function checkLeverActivation(p) {
  const lever = level.lever;
  if (!lever || lever.pulled) return;
  if (rectsOverlap(p, lever)) {
    lever.pulled = true;
    sfxWin();
    spawnParticles(lever.x+11, lever.y+12, currentBiome.accent, 14, 3);
    showBanner("⚙️ Bridge activated!", currentBiome.accent);
    // Stagger the bridge reveal animation
    level.bridge.forEach((b, i) => { b.active = true; });
  }
}

// Animate bridge segments rising into place once activated
function updateBridge(bridge) {
  for (const b of bridge) {
    if (!b.active) continue;
    if (b.revealDelay > 0) { b.revealDelay--; continue; }
    if (b.revealProgress < 1) {
      b.revealProgress = Math.min(1, b.revealProgress + 0.06);
      // Occasional sparkle while rising — spawned here (update), not in draw
      if (Math.random() < 0.25) {
        const riseOffset = (1-b.revealProgress) * 40;
        spawnParticles(b.x + b.w*Math.random(), b.y + riseOffset, currentBiome.accent, 1, 1.2);
      }
    }
  }
}

// A bridge segment is solid (collidable) once its reveal animation completes
function bridgeIsSolid(b) { return b.active && b.revealProgress >= 1; }


// =========================================================================
// RENDERING
// =========================================================================
function drawBackground(time) {
  const b = currentBiome;
  ctx.fillStyle = b.bg;
  ctx.fillRect(0,0,CFG.VW,CFG.H);

  // Parallax offset — background elements scroll slower than the world (0.4x)
  const px = cameraX * 0.4;

  if (b.bgStars) {
    // Batch all stars into a single fill using one path with multiple subpaths
    ctx.fillStyle="#e8eaed";
    ctx.beginPath();
    for (const s of stars) {
      s.twinkle+=0.018;
      const sx = s.x - px;
      if (sx < -10 || sx > CFG.VW+10) continue;
      // Average alpha across stars (per-star alpha would need separate fills);
      // twinkle still varies the radius slightly for a shimmer effect
      const tw = 0.7+0.3*Math.sin(s.twinkle);
      ctx.moveTo(sx+s.r*tw, s.y);
      ctx.arc(sx, s.y, s.r*tw, 0, Math.PI*2);
    }
    ctx.globalAlpha = 0.55;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (b.name==="Forest") {
    // Silhouette trees — span the world, parallax scrolled, single fill path
    ctx.fillStyle="rgba(10,35,10,0.55)";
    ctx.beginPath();
    const start = Math.floor(px/55)*55 - 55;
    for (let wx=start; wx<px+CFG.VW+55; wx+=55) {
      const tx = wx - px;
      const th = 60+Math.sin(wx*0.07)*20;
      ctx.moveTo(tx, CFG.groundY);
      ctx.lineTo(tx+14, CFG.groundY-th);
      ctx.lineTo(tx+28, CFG.groundY);
      ctx.closePath();
    }
    ctx.fill();
  }
  if (b.name==="Volcano") {
    // Lava glow at bottom
    const g=ctx.createLinearGradient(0,CFG.groundY-10,0,CFG.H);
    g.addColorStop(0,"rgba(180,30,0,0)"); g.addColorStop(1,"rgba(255,80,0,0.38)");
    ctx.fillStyle=g; ctx.fillRect(0,CFG.groundY-10,CFG.VW,CFG.H-CFG.groundY+10);
    // Floating embers — single batched fill
    ctx.fillStyle="#fb923c";
    ctx.beginPath();
    for (const s of stars) {
      const sx = s.x - px;
      if (sx < -10 || sx > CFG.VW+10) continue;
      const flicker=0.5+0.5*Math.sin(s.twinkle*1.3+time*0.001);
      const sy = CFG.H-s.y*0.5;
      ctx.moveTo(sx+s.r*0.8, sy);
      ctx.arc(sx, sy, s.r*0.8, 0, Math.PI*2);
    }
    ctx.globalAlpha = 0.35;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (b.name==="Dungeon") {
    // Stone wall pattern — parallax scrolled, batched into one stroke
    ctx.strokeStyle="rgba(255,255,255,0.025)"; ctx.lineWidth=1;
    ctx.beginPath();
    for (let gy=0;gy<CFG.H;gy+=40){ ctx.moveTo(0,gy); ctx.lineTo(CFG.VW,gy); }
    const offX = ((px%40)+40)%40;
    for (let row=0;row<CFG.H/40;row++) {
      const off=(row%2)*20 - offX;
      for (let gx=off;gx<CFG.VW;gx+=40){ ctx.moveTo(gx,row*40); ctx.lineTo(gx,row*40+40); }
    }
    ctx.stroke();
    // Torches — world-spaced, parallax scrolled. Glow batched, flames batched.
    const tStart = Math.floor(px/160)*160 - 160;
    const torchXs = [];
    for (let wx=tStart; wx<px+CFG.VW+160; wx+=160) torchXs.push(wx - px);

    ctx.fillStyle="#f97316";
    for (const tx of torchXs) {
      const fl=0.7+0.3*Math.sin(time*0.007+tx+px);
      ctx.globalAlpha=fl*0.18;
      ctx.beginPath(); ctx.arc(tx,60,18,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.beginPath();
    for (const tx of torchXs) ctx.rect(tx-3,52,6,14);
    ctx.fill();
    ctx.fillStyle="#fbbf24";
    ctx.beginPath();
    for (const tx of torchXs) {
      ctx.moveTo(tx,48); ctx.lineTo(tx+5,58); ctx.lineTo(tx-5,58); ctx.closePath();
    }
    ctx.fill();
  }
  if (b.bgGrid) {
    ctx.strokeStyle="rgba(255,255,255,0.022)"; ctx.lineWidth=1;
    const offX = ((px%40)+40)%40;
    ctx.beginPath();
    for (let gx=-offX;gx<CFG.VW;gx+=40){ ctx.moveTo(gx,0); ctx.lineTo(gx,CFG.H); }
    for (let gy=0;gy<CFG.H;gy+=40){ ctx.moveTo(0,gy); ctx.lineTo(CFG.VW,gy); }
    ctx.stroke();
  }

  // Pit gradient — viewport-fixed (always visible at bottom)
  const pitG=ctx.createLinearGradient(0,CFG.groundY-20,0,CFG.H);
  pitG.addColorStop(0,"rgba(0,0,0,0)"); pitG.addColorStop(1,b.pitColor);
  ctx.fillStyle=pitG; ctx.fillRect(0,CFG.groundY-20,CFG.VW,CFG.H-CFG.groundY+20);
}

function drawPlatforms(platforms) {
  for (const plat of platforms) {
    const b = plat.biome || currentBiome;
    const col = b.platform[plat.color % b.platform.length];
    const x=plat.x, y=plat.y, w=plat.w, h=plat.h;

    // ── Base fill ──────────────────────────────────────────────────────
    ctx.fillStyle = col;
    ctx.fillRect(x, y, w, h);

    // ── Biome-specific texture ─────────────────────────────────────────
    const name = b.name;

    if (name === "Space") {
      // Dark metallic panels with seams and corner bolts
      ctx.fillStyle = "rgba(0,0,0,0.22)";
      ctx.fillRect(x+1, y+1, w-2, h-2);
      // Panel seams every 28px
      ctx.strokeStyle = "rgba(255,255,255,0.10)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let sx = x+28; sx < x+w-8; sx += 28) {
        ctx.moveTo(sx, y+2); ctx.lineTo(sx, y+h-2);
      }
      ctx.stroke();
      // Corner bolts
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      [[x+4,y+3],[x+w-5,y+3],[x+4,y+h-4],[x+w-5,y+h-4]].forEach(([bx,by])=>{
        ctx.beginPath(); ctx.arc(bx,by,1.5,0,Math.PI*2); ctx.fill();
      });
    } else if (name === "Forest") {
      // Wooden planks with grain lines and knots
      ctx.fillStyle = "rgba(0,0,0,0.15)";
      ctx.fillRect(x+1, y+1, w-2, h-2);
      ctx.strokeStyle = "rgba(0,0,0,0.18)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      // Plank dividers every 22px
      for (let sx = x+22; sx < x+w-6; sx += 22) {
        ctx.moveTo(sx, y+1); ctx.lineTo(sx, y+h-1);
      }
      ctx.stroke();
      // Grain lines
      ctx.strokeStyle = "rgba(0,0,0,0.09)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x+2, y+h*0.38); ctx.lineTo(x+w-2, y+h*0.38);
      ctx.moveTo(x+2, y+h*0.68); ctx.lineTo(x+w-2, y+h*0.68);
      ctx.stroke();
      // Knot at plank centre
      if (w > 50) {
        ctx.strokeStyle = "rgba(0,0,0,0.14)";
        ctx.beginPath();
        ctx.ellipse(x+w*0.5, y+h*0.5, 4, 3, 0, 0, Math.PI*2);
        ctx.stroke();
      }
    } else if (name === "Dungeon") {
      // Stone blocks with mortar lines and random cracks
      ctx.fillStyle = "rgba(0,0,0,0.20)";
      ctx.fillRect(x+1, y+1, w-2, h-2);
      // Mortar horizontal
      ctx.strokeStyle = "rgba(0,0,0,0.30)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x+1, y+h/2); ctx.lineTo(x+w-1, y+h/2);
      ctx.stroke();
      // Mortar vertical — staggered like real stonework
      ctx.beginPath();
      const blockW = 26;
      for (let bx = x + blockW; bx < x+w-6; bx += blockW) {
        ctx.moveTo(bx, y+1); ctx.lineTo(bx, y+h/2-1);
      }
      for (let bx = x + blockW*0.5; bx < x+w-6; bx += blockW) {
        ctx.moveTo(bx, y+h/2+1); ctx.lineTo(bx, y+h-1);
      }
      ctx.stroke();
      // Crack detail
      ctx.strokeStyle = "rgba(0,0,0,0.22)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      const crackX = x + w*0.3;
      ctx.moveTo(crackX, y+2);
      ctx.lineTo(crackX+3, y+h*0.4);
      ctx.lineTo(crackX+1, y+h-2);
      ctx.stroke();
    } else if (name === "Volcano") {
      // Scorched rock with glowing lava cracks
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.fillRect(x+1, y+1, w-2, h-2);
      // Lava cracks — glowing orange lines
      ctx.strokeStyle = "rgba(255,120,0,0.55)";
      ctx.lineWidth = 1.5;
      ctx.shadowColor = "rgba(255,80,0,0.6)";
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.moveTo(x+6, y+h-2);
      ctx.lineTo(x+w*0.35, y+2);
      ctx.lineTo(x+w*0.5, y+h*0.6);
      ctx.lineTo(x+w*0.72, y+2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      // Rock surface shade
      ctx.fillStyle = "rgba(0,0,0,0.12)";
      ctx.fillRect(x+2, y+1, w-4, 3);
    }

    // ── Top highlight (all biomes) ─────────────────────────────────────
    ctx.fillStyle = "rgba(255,255,255,0.13)";
    ctx.fillRect(x, y, w, 3);

    // ── Moving platform indicator ──────────────────────────────────────
    if (plat.moving) {
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, w, h);
    }
  }
}

// Persistent ambient particles for wind zones — drift continuously and
// respawn at the upwind edge, separate from the short-lived burst particles.
// ── Wind leaves — level-wide, viewport-space (no world translate needed) ──
let windLeaves = [];
let windLeavesLevelRef = null;

// Biome-specific leaf colours
function leafColor(biomeName) {
  if (biomeName === "Forest")  return ["rgba(120,200,80,0.7)","rgba(160,220,90,0.65)","rgba(90,170,60,0.6)"];
  if (biomeName === "Volcano") return ["rgba(220,80,30,0.65)","rgba(200,50,20,0.6)","rgba(240,120,40,0.55)"];
  if (biomeName === "Dungeon") return ["rgba(180,160,120,0.5)","rgba(140,120,90,0.45)"];
  return ["rgba(180,210,255,0.5)","rgba(200,230,255,0.45)"]; // Space: dust motes
}

function initWindLeaves(windZones) {
  if (windLeavesLevelRef === windZones) return;
  windLeavesLevelRef = windZones;
  windLeaves = [];
  if (!windZones || !windZones.length) return;
  const wz = windZones[0]; // single full-level zone
  const cols = leafColor(currentBiome.name);
  for (let i=0; i<22; i++) {
    windLeaves.push({
      x: Math.random() * CFG.VW,   // viewport-space X
      y: Math.random() * CFG.H,
      vy: -0.15 + Math.random()*0.3,
      r: 2.5 + Math.random()*3.5,
      spin: Math.random()*Math.PI*2,
      spinSpeed: (Math.random()-0.5)*0.08,
      wobblePhase: Math.random()*Math.PI*2,
      wobbleAmp: 2.5 + Math.random()*3,
      speed: (0.8 + Math.random()*1.2) * (wz.strength * 35),
      col: cols[Math.floor(Math.random()*cols.length)],
      dir: wz.dir,
    });
  }
}

function updateWindLeaves() {
  for (const p of windLeaves) {
    p.x += p.speed * p.dir;
    p.y += p.vy + Math.sin(p.wobblePhase) * 0.4;
    p.wobblePhase += 0.025;
    p.spin += p.spinSpeed;
    // Wrap around viewport
    if (p.dir > 0 && p.x > CFG.VW + 10) p.x = -10;
    if (p.dir < 0 && p.x < -10) p.x = CFG.VW + 10;
    if (p.y > CFG.H + 10) p.y = -10;
    if (p.y < -10) p.y = CFG.H + 10;
  }
}

function drawWindZones(windZones, time) {
  if (!windZones || !windZones.length) return;
  initWindLeaves(windZones);
  updateWindLeaves();
  // Draw leaves in viewport space (no camera translate — already outside ctx.save/restore)
  // NOTE: render() calls this BEFORE ctx.save/translate, so coords are viewport-space.
  for (const p of windLeaves) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.spin);
    ctx.fillStyle = p.col;
    ctx.beginPath();
    // Leaf shape: pointed ellipse with a small stem
    ctx.ellipse(0, 0, p.r, p.r*0.45, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawSpikes(spikes) {
  if (!spikes.length) return;
  const b = currentBiome;
  ctx.shadowColor = b.spikeGlow; ctx.shadowBlur = 6;
  ctx.fillStyle = b.spike;
  ctx.beginPath();
  for (const s of spikes) {
    ctx.moveTo(s.x+s.w/2, s.y);
    ctx.lineTo(s.x+s.w, s.y+s.h);
    ctx.lineTo(s.x, s.y+s.h);
    ctx.closePath();
  }
  ctx.fill();
  ctx.shadowBlur=0;
}


function drawCoins(coins, time) {
  const visible = coins.filter(c => !c.collected);
  if (!visible.length) return;

  // Pass 1: glowing coin bodies, batched into one path
  ctx.shadowColor="rgba(251,191,36,0.55)"; ctx.shadowBlur=8;
  ctx.fillStyle="#fbbf24";
  ctx.beginPath();
  for (const coin of visible) {
    const bob=Math.sin(time*0.003+coin.bobOffset)*3;
    const cx=coin.x+7, cy=coin.y+7+bob;
    ctx.moveTo(cx+7, cy);
    ctx.arc(cx,cy,7,0,Math.PI*2);
  }
  ctx.fill();
  ctx.shadowBlur=0;

  // Pass 2: highlight dots, batched, no shadow
  ctx.fillStyle="rgba(255,255,255,0.45)";
  ctx.beginPath();
  for (const coin of visible) {
    const bob=Math.sin(time*0.003+coin.bobOffset)*3;
    const cx=coin.x+7, cy=coin.y+7+bob;
    ctx.moveTo(cx-2+2.5, cy-2);
    ctx.arc(cx-2,cy-2,2.5,0,Math.PI*2);
  }
  ctx.fill();
}

function drawSpawn(spawn) {
  ctx.strokeStyle="#94a3b8"; ctx.lineWidth=2; ctx.setLineDash([4,4]);
  ctx.strokeRect(spawn.x-4,spawn.y-4,CFG.pSize+8,CFG.pSize+8);
  ctx.setLineDash([]);
}

function drawDoor(door, time) {
  const pulse=0.5+0.5*Math.sin(time*0.006);
  ctx.shadowColor=currentBiome.accent; ctx.shadowBlur=12+pulse*16;
  ctx.fillStyle="rgba(251,191,36,0.4)";
  ctx.fillRect(door.x-6,door.y-6,door.w+12,door.h+12);
  ctx.fillStyle="#fbbf24";
  ctx.fillRect(door.x,door.y,door.w,door.h);
  ctx.fillStyle="#1a1408";
  ctx.fillRect(door.x+10,door.y+8,door.w-20,door.h-16);
  ctx.shadowBlur=0;
  ctx.strokeStyle=`rgba(255,255,255,${0.3+pulse*0.4})`; ctx.lineWidth=2;
  ctx.strokeRect(door.x,door.y,door.w,door.h);
}

function drawLever(lever, time) {
  if (!lever) return;
  const cx = lever.x + lever.w/2;
  const baseY = lever.y + lever.h - 4;
  // Base plinth
  ctx.fillStyle = "#44403c";
  ctx.fillRect(lever.x, baseY, lever.w, 6);
  // Lever arm — rotates from upright (idle) to pulled (down/sideways)
  const angle = lever.pulled ? Math.PI*0.32 : 0;
  ctx.save();
  ctx.translate(cx, baseY);
  ctx.rotate(angle);
  ctx.strokeStyle = lever.pulled ? "#22c55e" : currentBiome.accent;
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -lever.h+4);
  ctx.stroke();
  // Handle knob
  ctx.fillStyle = lever.pulled ? "#22c55e" : currentBiome.accent;
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = lever.pulled ? 4 : 10;
  ctx.beginPath(); ctx.arc(0, -lever.h+4, 5, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  // Subtle pulsing glow when not yet pulled — draws attention
  if (!lever.pulled) {
    const pulse = 0.4 + 0.3*Math.sin(time*0.006);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = currentBiome.accent;
    ctx.beginPath(); ctx.arc(cx, lever.y-6, 3, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawBridge(bridge, time) {
  for (const b of bridge) {
    if (!b.active || b.revealProgress <= 0) continue;
    const t = b.revealProgress;
    // Segments rise up from below into position
    const riseOffset = (1-t) * 40;
    const alpha = t;
    const by = b.y + riseOffset;
    ctx.globalAlpha = alpha;
    const col = b.biome.platform[b.color % b.biome.platform.length];
    ctx.fillStyle = col;
    ctx.fillRect(b.x, by, b.w, b.h);
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.fillRect(b.x, by, b.w, 3);
    ctx.globalAlpha = 1;
  }
}

function drawPlayer(p) {
  let dw=p.w,dh=p.h,dx=p.x,dy=p.y;
  if(p.vy<-0.8){dh=p.h*0.9;dw=p.w*1.07;dy+=p.h-dh;}
  else if(p.vy>0.8){dh=p.h*1.06;dw=p.w*0.93;dy-=dh-p.h;}
  if(p.landSquash>0){const s=1+p.landSquash*0.018;dw*=s;dh/=s;dy+=p.h-dh;}
  if(p.onGround&&Math.abs(p.vx)>0.12) dy+=Math.sin(p.animT)*1.8;
  const lean=Math.max(-0.14,Math.min(0.14,p.vx*0.055));
  for(const d of p.slideDust){ctx.fillStyle=`rgba(148,163,184,${(d.life/14)*0.5})`;ctx.fillRect(d.x,d.y,4,3);}
  ctx.save();
  ctx.translate(dx+dw/2,dy+dh); ctx.rotate(lean);
  ctx.fillStyle=deathFlash>0?"#f87171":"#38bdf8";
  ctx.fillRect(-dw/2,-dh,dw,dh);
  ctx.fillStyle="rgba(255,255,255,0.35)";
  ctx.fillRect(p.facing>0?4:-12,-dh+6,8,8);
  ctx.restore();
}

function render(time) {
  drawBackground(time);
  drawWindZones(level.windZones, time); // viewport-space — must be before camera translate
  ctx.save();
  ctx.translate(-cameraX, 0);
  drawPlatforms(level.platforms);
  drawBridge(level.bridge, time);
  drawLever(level.lever, time);
  drawDoor(level.door, time);
  drawSpikes(level.spikes);
  drawCoins(level.coins, time);
  drawSpawn(level.spawn);
  drawPlayer(player);
  drawParticles();
  ctx.restore();
  if(deathFlash>0){ctx.fillStyle=`rgba(239,68,68,${deathFlash*0.32})`;ctx.fillRect(0,0,CFG.VW,CFG.H);}
}
