<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="MrMidnight">
  <title>Platformer · MrMidnight</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: #0d0f14;
      color: #e8eaed;
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 1rem;
      user-select: none;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .hud {
      display: flex;
      gap: 1.5rem;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      color: #9aa0a6;
    }

    .hud strong {
      color: #e8eaed;
      margin-left: 0.35rem;
    }

    #game {
      display: block;
      border: 2px solid #2a3140;
      border-radius: 4px;
      background: #12151c;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      image-rendering: pixelated;
    }

    .hint {
      font-size: 0.8rem;
      color: #6b7280;
      text-align: center;
      max-width: 640px;
      line-height: 1.45;
    }

    .credit {
      font-size: 0.8rem;
      color: #6b7280;
    }

    .credit a {
      color: #9aa0a6;
      text-decoration: none;
    }

    .credit a:hover {
      color: #e8eaed;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Platformer</h1>
  <div class="hud">
    <span>Level<strong id="levelDisplay">1</strong></span>
    <span>Score<strong id="scoreDisplay">0</strong></span>
  </div>
  <canvas id="game" width="800" height="480" aria-label="Platformer game"></canvas>
  <p class="hint">← → move · ↑ jump · reach the glowing door · avoid red spikes</p>
  <p class="credit">by <a href="https://github.com/MrMidnight-dev" target="_blank" rel="noopener noreferrer">MrMidnight</a></p>

  <script>
    // =========================================================================
    // CONFIG — world size, physics, colors (fixed camera = entire level on canvas)
    // =========================================================================
    const CONFIG = {
      width: 800,
      height: 480,
      gravityUp: 0.2,
      gravityFall: 0.26,
      moveSpeed: 2.4,
      moveAccel: 0.14,
      groundFriction: 0.86,
      airFriction: 0.97,
      jumpForce: -8.6,
      jumpCutVy: -3.8,
      maxFallSpeed: 4.5,
      playerSize: 28,
      pitY: 468, // fall below this → respawn (no walkable floor across the map)
      // Level generation constraints (keeps jumps possible between platforms)
      platformMinW: 70,
      platformMaxW: 130,
      platformH: 16,
      maxJumpX: 95,
      maxJumpUp: 78,
      maxDrop: 95,
      minPlatforms: 7,
      maxPlatforms: 10,
      spikeChance: 0.4,
      groundY: 420, // visual reference only
    };

    const COLORS = {
      bg: "#12151c",
      platform: ["#3b82f6", "#22c55e", "#a855f7", "#f59e0b", "#06b6d4"],
      spike: "#ef4444",
      door: "#fbbf24",
      doorGlow: "rgba(251, 191, 36, 0.45)",
      player: "#38bdf8",
      spawn: "#94a3b8",
      text: "#e8eaed",
      death: "#f87171",
    };

    // =========================================================================
    // STATE — shared game data updated each frame / on level events
    // =========================================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const levelDisplay = document.getElementById("levelDisplay");
    const scoreDisplay = document.getElementById("scoreDisplay");

    const keys = { left: false, right: false, up: false };

    let levelNumber = 1;
    let score = 0;
    let level = null;
    let player = null;
    let deathFlash = 0;
    let isDead = false; // prevents spike damage from firing every frame

    // =========================================================================
    // LEVEL GENERATION — random platforms, spikes, spawn, door (playable path)
    // =========================================================================

    /**
     * Pick a random integer in [min, max] (inclusive).
     */
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    /**
     * Reject layouts where the exit is trivial to reach (flat run, too close, etc.).
     */
    function isLevelPlayable(platforms) {
      if (platforms.length < CONFIG.minPlatforms) return false;

      const first = platforms[0];
      const last = platforms[platforms.length - 1];

      // Door must sit on the right side of the map
      if (last.x + last.w < CONFIG.width * 0.62) return false;

      // Need real vertical routing (not a single horizontal line of platforms)
      let heightChanges = 0;
      let bigGaps = 0;
      for (let i = 1; i < platforms.length; i++) {
        const prev = platforms[i - 1];
        const cur = platforms[i];
        if (Math.abs(cur.y - prev.y) >= 32) heightChanges++;
        const gap = cur.x - (prev.x + prev.w);
        if (gap >= 48) bigGaps++;
      }
      if (heightChanges < 2 || bigGaps < 1) return false;

      // Spawn and exit should not be on the same low shelf
      if (Math.abs(first.y - last.y) < 40 && last.x - first.x < 320) return false;

      return true;
    }

    /**
     * Build one random level: chained platforms with gaps (no full-width floor).
     * Retries until the layout forces platforming to reach the door.
     */
    function tryGenerateLevel() {
      const platforms = [];
      const spikes = [];

      let x = 36;
      let y = CONFIG.groundY - randInt(70, 130);
      let w = randInt(95, 130);
      platforms.push({ x, y, w, h: CONFIG.platformH, color: 0 });

      const count = randInt(CONFIG.minPlatforms, CONFIG.maxPlatforms);

      for (let i = 1; i < count; i++) {
        const prev = platforms[platforms.length - 1];
        const isLast = i === count - 1;

        // Wider gaps and more height change near the exit
        const gapX = isLast
          ? randInt(58, CONFIG.maxJumpX)
          : i % 2 === 0
            ? randInt(50, CONFIG.maxJumpX)
            : randInt(32, 72);

        let dy;
        if (isLast) {
          // Exit platform: usually higher so you cannot sprint on the bottom
          dy = randInt(-CONFIG.maxJumpUp, -25);
        } else if (i % 3 === 0) {
          dy = randInt(-CONFIG.maxJumpUp, -15);
        } else {
          dy = randInt(-CONFIG.maxJumpUp, CONFIG.maxDrop);
        }

        x = prev.x + prev.w + gapX;
        y = Math.max(90, Math.min(CONFIG.groundY - 70, prev.y + dy));
        w = randInt(CONFIG.platformMinW, CONFIG.platformMaxW);

        if (x + w > CONFIG.width - 44) {
          x = CONFIG.width - w - 44;
        }

        platforms.push({
          x,
          y,
          w,
          h: CONFIG.platformH,
          color: i % COLORS.platform.length,
        });

        if (!isLast && i > 1 && Math.random() < CONFIG.spikeChance) {
          const spikeCount = randInt(1, 2);
          for (let s = 0; s < spikeCount; s++) {
            spikes.push({
              x: x + 14 + s * 24 + randInt(0, Math.max(0, w - 44)),
              y: y - 14,
              w: 14,
              h: 14,
            });
          }
        }
      }

      const last = platforms[platforms.length - 1];
      const door = {
        x: last.x + last.w / 2 - 18,
        y: last.y - 44,
        w: 36,
        h: 44,
      };
      const spawn = {
        x: platforms[0].x + 24,
        y: platforms[0].y - CONFIG.playerSize,
      };

      return { platforms, spikes, spawn, door };
    }

    function generateLevel() {
      for (let attempt = 0; attempt < 40; attempt++) {
        const candidate = tryGenerateLevel();
        if (isLevelPlayable(candidate.platforms)) return candidate;
      }
      return tryGenerateLevel();
    }

    // =========================================================================
    // PLAYER — movement, gravity integration, jump input
    // =========================================================================

    function createPlayer(spawn) {
      return {
        x: spawn.x,
        y: spawn.y,
        w: CONFIG.playerSize,
        h: CONFIG.playerSize,
        vx: 0,
        vy: 0,
        onGround: false,
        wasOnGround: false,
        facing: 1,
        animT: 0,
        landSquash: 0,
        slideDust: [],
      };
    }

    /**
     * Horizontal: accelerate while holding keys, slide with friction when released.
     * Vertical: softer jump arc; release ↑ early for a shorter hop.
     */
    function updatePlayer(p) {
      if (keys.left) {
        p.vx -= CONFIG.moveAccel;
        p.facing = -1;
      }
      if (keys.right) {
        p.vx += CONFIG.moveAccel;
        p.facing = 1;
      }

      if (keys.left && keys.right) {
        // no extra accel when both pressed
      } else if (!keys.left && !keys.right) {
        const friction = p.onGround ? CONFIG.groundFriction : CONFIG.airFriction;
        p.vx *= friction;
        if (Math.abs(p.vx) < 0.04) p.vx = 0;
      }

      if (p.vx > CONFIG.moveSpeed) p.vx = CONFIG.moveSpeed;
      if (p.vx < -CONFIG.moveSpeed) p.vx = -CONFIG.moveSpeed;

      if (keys.up && p.onGround) {
        p.vy = CONFIG.jumpForce;
        p.onGround = false;
      }

      if (!keys.up && p.vy < 0 && p.vy > CONFIG.jumpCutVy) {
        p.vy = Math.max(p.vy * 0.88, CONFIG.jumpCutVy);
      }

      if (p.vy < 0) {
        p.vy += keys.up ? CONFIG.gravityUp : CONFIG.gravityUp * 1.15;
      } else {
        p.vy += CONFIG.gravityFall;
      }
      if (p.vy > CONFIG.maxFallSpeed) p.vy = CONFIG.maxFallSpeed;

      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0) {
        p.x = 0;
        p.vx *= 0.35;
      }
      if (p.x + p.w > CONFIG.width) {
        p.x = CONFIG.width - p.w;
        p.vx *= 0.35;
      }
    }

    /** Walk cycle, landing squash decay, slide dust when coasting to a stop */
    function updatePlayerMotionFx(p) {
      if (p.landSquash > 0) p.landSquash--;

      if (p.onGround && Math.abs(p.vx) > 0.35) {
        p.animT += 0.14 + Math.abs(p.vx) * 0.04;
      } else {
        p.animT *= 0.85;
      }

      const sliding = p.onGround && !keys.left && !keys.right && Math.abs(p.vx) > 0.5;
      if (sliding && Math.random() < 0.35) {
        p.slideDust.push({
          x: p.x + (p.vx > 0 ? 2 : p.w - 2),
          y: p.y + p.h - 3,
          life: 14,
          drift: -p.vx * 0.25,
        });
      }

      p.slideDust = p.slideDust.filter((d) => {
        d.x += d.drift;
        d.life--;
        return d.life > 0;
      });
    }

    function playerFellInPit(p) {
      return p.y + p.h >= CONFIG.pitY;
    }

    function resetPlayerToSpawn() {
      player.x = level.spawn.x;
      player.y = level.spawn.y;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      player.wasOnGround = false;
      player.landSquash = 0;
      player.slideDust = [];
      player.animT = 0;
    }

    // =========================================================================
    // COLLISIONS — AABB resolution for platforms, spikes, door
    // =========================================================================

    function rectsOverlap(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    /**
     * Resolve player vs all platforms (top landing + side blocking).
     */
    function resolvePlatformCollisions(p, platforms) {
      p.onGround = false;

      for (const plat of platforms) {
        if (!rectsOverlap(p, plat)) continue;

        const overlapLeft = p.x + p.w - plat.x;
        const overlapRight = plat.x + plat.w - p.x;
        const overlapTop = p.y + p.h - plat.y;
        const overlapBottom = plat.y + plat.h - p.y;

        const minX = Math.min(overlapLeft, overlapRight);
        const minY = Math.min(overlapTop, overlapBottom);

        // Prefer vertical resolution when falling onto a platform
        if (minY <= minX && p.vy >= 0 && overlapTop < overlapBottom + 8) {
          p.y = plat.y - p.h;
          if (p.vy > 2) p.landSquash = 12;
          p.vy = 0;
          p.onGround = true;
        } else if (minX < minY) {
          if (overlapLeft < overlapRight) {
            p.x = plat.x - p.w;
          } else {
            p.x = plat.x + plat.w;
          }
          p.vx *= 0.25;
        } else {
          p.y = plat.y + plat.h;
          p.vy = 0;
        }
      }
    }

    function playerHitsSpikes(p, spikes) {
      for (const spike of spikes) {
        if (rectsOverlap(p, spike)) return true;
      }
      return false;
    }

    function playerReachedDoor(p, door) {
      return rectsOverlap(p, door);
    }

    // =========================================================================
    // RENDERING — draw level, player, HUD overlays (fixed camera = full canvas)
    // =========================================================================

    function drawBackground() {
      ctx.fillStyle = COLORS.bg;
      ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

      // Pit area (decorative — no collision)
      const pitGrad = ctx.createLinearGradient(0, CONFIG.groundY - 20, 0, CONFIG.height);
      pitGrad.addColorStop(0, "rgba(15, 18, 26, 0)");
      pitGrad.addColorStop(1, "rgba(0, 0, 0, 0.55)");
      ctx.fillStyle = pitGrad;
      ctx.fillRect(0, CONFIG.groundY - 20, CONFIG.width, CONFIG.height - CONFIG.groundY + 20);

      // Subtle grid for depth
      ctx.strokeStyle = "rgba(255,255,255,0.03)";
      ctx.lineWidth = 1;
      for (let gx = 0; gx < CONFIG.width; gx += 40) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, CONFIG.height);
        ctx.stroke();
      }
      for (let gy = 0; gy < CONFIG.height; gy += 40) {
        ctx.beginPath();
        ctx.moveTo(0, gy);
        ctx.lineTo(CONFIG.width, gy);
        ctx.stroke();
      }
    }

    function drawPlatforms(platforms) {
      for (const plat of platforms) {
        const color = COLORS.platform[plat.color % COLORS.platform.length];
        ctx.fillStyle = color;
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(plat.x, plat.y, plat.w, 3);
      }
    }

    function drawSpikes(spikes) {
      for (const spike of spikes) {
        ctx.fillStyle = COLORS.spike;
        ctx.beginPath();
        ctx.moveTo(spike.x + spike.w / 2, spike.y);
        ctx.lineTo(spike.x + spike.w, spike.y + spike.h);
        ctx.lineTo(spike.x, spike.y + spike.h);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawSpawn(spawn) {
      ctx.strokeStyle = COLORS.spawn;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(spawn.x - 4, spawn.y - 4, CONFIG.playerSize + 8, CONFIG.playerSize + 8);
      ctx.setLineDash([]);
    }

    /** Glowing exit door — pulse uses time for animation */
    function drawDoor(door, time) {
      const pulse = 0.5 + 0.5 * Math.sin(time * 0.006);

      ctx.shadowColor = COLORS.door;
      ctx.shadowBlur = 12 + pulse * 16;
      ctx.fillStyle = COLORS.doorGlow;
      ctx.fillRect(door.x - 6, door.y - 6, door.w + 12, door.h + 12);

      ctx.fillStyle = COLORS.door;
      ctx.fillRect(door.x, door.y, door.w, door.h);

      ctx.fillStyle = "#1a1408";
      ctx.fillRect(door.x + 10, door.y + 8, door.w - 20, door.h - 16);

      ctx.shadowBlur = 0;
      ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 + pulse * 0.4})`;
      ctx.lineWidth = 2;
      ctx.strokeRect(door.x, door.y, door.w, door.h);
    }

    function drawSlideDust(p) {
      for (const d of p.slideDust) {
        const alpha = d.life / 14;
        ctx.fillStyle = `rgba(148, 163, 184, ${alpha * 0.5})`;
        ctx.fillRect(d.x, d.y, 4, 3);
      }
    }

    /** Squash / stretch + lean for smoother motion feel */
    function drawPlayer(p) {
      let dw = p.w;
      let dh = p.h;
      let dx = p.x;
      let dy = p.y;

      if (p.vy < -0.8) {
        dh = p.h * 0.9;
        dw = p.w * 1.07;
        dy += p.h - dh;
      } else if (p.vy > 0.8) {
        dh = p.h * 1.06;
        dw = p.w * 0.93;
        dy -= dh - p.h;
      }

      if (p.landSquash > 0) {
        const s = 1 + p.landSquash * 0.018;
        dw *= s;
        dh /= s;
        dy += p.h - dh;
      }

      if (p.onGround && Math.abs(p.vx) > 0.12) {
        dy += Math.sin(p.animT) * 1.8;
      }

      const lean = Math.max(-0.14, Math.min(0.14, p.vx * 0.055));
      const cx = dx + dw / 2;
      const cy = dy + dh;

      drawSlideDust(p);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(lean);
      ctx.fillStyle = deathFlash > 0 ? COLORS.death : COLORS.player;
      ctx.fillRect(-dw / 2, -dh, dw, dh);
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      const eyeX = p.facing > 0 ? 4 : -12;
      ctx.fillRect(eyeX, -dh + 6, 8, 8);
      ctx.restore();
    }

    function render(time) {
      drawBackground();
      drawPlatforms(level.platforms);
      drawSpikes(level.spikes);
      drawSpawn(level.spawn);
      drawDoor(level.door, time);
      drawPlayer(player);

      if (deathFlash > 0) {
        ctx.fillStyle = `rgba(239, 68, 68, ${deathFlash * 0.35})`;
        ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
      }
    }

    // =========================================================================
    // GAME FLOW — start level, death, advance stage, UI updates
    // =========================================================================

    function updateHud() {
      levelDisplay.textContent = levelNumber;
      scoreDisplay.textContent = score;
    }

    /** Load a fresh random layout; optional: keep score / bump level number */
    function startLevel(advance = false) {
      if (advance) {
        score++;
        levelNumber++;
      }
      level = generateLevel();
      player = createPlayer(level.spawn);
      deathFlash = 0;
      updateHud();
    }

    function killPlayer() {
      if (isDead) return;
      isDead = true;
      deathFlash = 1;
      setTimeout(() => {
        resetPlayerToSpawn();
        deathFlash = 0;
        isDead = false;
      }, 350);
    }

    function completeLevel() {
      startLevel(true);
    }

    // =========================================================================
    // MAIN LOOP
    // =========================================================================

    let lastTime = 0;

    function gameLoop(time) {
      player.wasOnGround = player.onGround;
      updatePlayer(player);
      resolvePlatformCollisions(player, level.platforms);

      if (player.onGround && !player.wasOnGround) {
        player.landSquash = Math.max(player.landSquash, 10);
      }
      updatePlayerMotionFx(player);

      if (playerFellInPit(player)) {
        killPlayer();
      } else if (playerHitsSpikes(player, level.spikes)) {
        killPlayer();
      } else if (playerReachedDoor(player, level.door)) {
        completeLevel();
      }

      if (deathFlash > 0) deathFlash = Math.max(0, deathFlash - 0.08);

      render(time);
      lastTime = time;
      requestAnimationFrame(gameLoop);
    }

    // =========================================================================
    // INPUT
    // =========================================================================

    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft") keys.left = true;
      if (e.code === "ArrowRight") keys.right = true;
      if (e.code === "ArrowUp") keys.up = true;
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(e.code)) {
        e.preventDefault();
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft") keys.left = false;
      if (e.code === "ArrowRight") keys.right = false;
      if (e.code === "ArrowUp") keys.up = false;
    });

    // =========================================================================
    // BOOT
    // =========================================================================
    startLevel(false);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
